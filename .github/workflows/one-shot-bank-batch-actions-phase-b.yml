name: One-shot Bank Phase B batch actions

# Trigger marker after fixing required BankReceiptLink allocation in tests.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/bank-classification-phase-b
    paths:
      - '.github/workflows/one-shot-bank-batch-actions-phase-b.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bank-classification-phase-b
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create local debug keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Apply Phase B batch actions
        run: |
          python3 .github/scripts/apply_bank_batch_actions_phase_b.py
          git diff --check
      - name: Lint
        run: gradle :app:lintDebug --no-daemon
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Commit verified Phase B batch actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "Add safe bank batch actions"
          git pull --rebase origin feature/bank-classification-phase-b
          git push origin HEAD:feature/bank-classification-phase-b
