name: Apply Bank Exact Design

on:
  push:
    branches: [ bank-design-patch-runner ]
    paths:
      - .github/workflows/apply-bank-exact-design.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bank-design-patch-runner
          fetch-depth: 0
      - name: Patch Bank UI to approved reference design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/ui/BankFeature.kt')
          s = p.read_text(encoding='utf-8')

          def must_replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          must_replace(
              'import androidx.compose.foundation.rememberScrollState\n',
              'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\n',
              'verticalScroll import'
          )
          must_replace(
              'import androidx.compose.material.icons.filled.Search\n',
              'import androidx.compose.material.icons.filled.Search\nimport androidx.compose.material.icons.filled.Tune\nimport androidx.compose.material.icons.filled.ShoppingCart\nimport androidx.compose.material.icons.filled.Home\nimport androidx.compose.material.icons.filled.Build\nimport androidx.compose.material.icons.filled.Person\nimport androidx.compose.material.icons.filled.Description\nimport androidx.compose.material.icons.filled.CalendarMonth\n',
              'transaction icon imports'
          )
          must_replace(
              'import androidx.compose.material3.FilterChip\n',
              'import androidx.compose.material3.FilterChip\nimport androidx.compose.material3.FilterChipDefaults\n',
              'filter chip defaults import'
          )

          must_replace(
              '    var toolsMode by remember { mutableStateOf(BankToolsMode.NONE) }\n',
              '    var toolsMode by remember { mutableStateOf(BankToolsMode.NONE) }\n    var showImportDetails by remember { mutableStateOf(false) }\n',
              'import details state'
          )

          must_replace(
              '                        modifier = Modifier.weight(1f),\n                        singleLine = true,\n                        placeholder = { Text("Buchungen durchsuchen …") },\n',
              '                        modifier = Modifier.weight(1f).height(52.dp),\n                        singleLine = true,\n                        shape = RoundedCornerShape(26.dp),\n                        placeholder = { Text("Buchungen durchsuchen …") },\n',
              'search field shape'
          )
          must_replace(
              '                            Icon(Icons.Default.MoreHoriz, contentDescription = "Filter und Werkzeuge")\n',
              '                            Icon(Icons.Default.Tune, contentDescription = "Filter und Werkzeuge", tint = DarkNavy)\n',
              'search toolbar icon'
          )

          old_chip = '''                        FilterChip(
                            selected = filter == item,
                            onClick = { filter = item },
                            label = { Text("${BankCompactUiPolicy.filterLabel(item)} (${BankCompactUiPolicy.countFor(counts, item)})", maxLines = 1) }
                        )'''
          new_chip = '''                        FilterChip(
                            selected = filter == item,
                            onClick = { filter = item },
                            label = { Text("${BankCompactUiPolicy.filterLabel(item)} (${BankCompactUiPolicy.countFor(counts, item)})", maxLines = 1) },
                            colors = FilterChipDefaults.filterChipColors(
                                containerColor = Color.White,
                                labelColor = SlateGray,
                                selectedContainerColor = Color(0xFF3B82F6),
                                selectedLabelColor = Color.White
                            )
                        )'''
          must_replace(old_chip, new_chip, 'blue status chips')

          old_summary = '''                if (!importStatus.isNullOrBlank()) Text(importStatus.orEmpty(), fontSize = 11.sp, color = SlateGray, modifier = Modifier.padding(top = 4.dp))'''
          new_summary = '''                if (!importStatus.isNullOrBlank()) {
                    val importHeadline = importStatus.orEmpty().lineSequence().firstOrNull().orEmpty()
                    Row(
                        modifier = Modifier.fillMaxWidth().padding(top = 3.dp).clickable { showImportDetails = true },
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text("✓", color = EmeraldGreen, fontWeight = FontWeight.Bold)
                        Spacer(Modifier.size(5.dp))
                        Text(
                            importHeadline,
                            modifier = Modifier.weight(1f),
                            fontSize = 10.sp,
                            color = SlateGray,
                            maxLines = 1,
                            overflow = TextOverflow.Ellipsis
                        )
                        Text("Importdetails", fontSize = 10.sp, color = AccentBlue, fontWeight = FontWeight.SemiBold)
                    }
                }'''
          must_replace(old_summary, new_summary, 'collapsed import details')

          old_groups = '''                groups.forEach { group ->
                    item(key = "date-${group.key}") {
                        Text(group.label, fontWeight = FontWeight.Bold, color = SlateGray, fontSize = 13.sp, modifier = Modifier.padding(top = 6.dp, bottom = 2.dp))
                    }
                    items(group.transactions, key = { it.transactionId }) { transaction ->
                        BankCompactTransactionRow(transaction = transaction, onClick = { selectedTransactionId = transaction.transactionId })
                    }
                }'''
          new_groups = '''                groups.forEach { group ->
                    item(key = "date-${group.key}") {
                        Text(group.label, fontWeight = FontWeight.Bold, color = SlateGray, fontSize = 13.sp, modifier = Modifier.padding(top = 7.dp, bottom = 2.dp))
                    }
                    item(key = "group-${group.key}") {
                        Card(
                            modifier = Modifier.fillMaxWidth(),
                            colors = CardDefaults.cardColors(containerColor = Color.White),
                            border = BorderStroke(1.dp, BorderColor),
                            shape = RoundedCornerShape(14.dp)
                        ) {
                            Column {
                                group.transactions.forEachIndexed { index, transaction ->
                                    BankCompactTransactionRow(transaction = transaction, onClick = { selectedTransactionId = transaction.transactionId })
                                    if (index < group.transactions.lastIndex) HorizontalDivider(color = BorderColor)
                                }
                            }
                        }
                    }
                }'''
          must_replace(old_groups, new_groups, 'grouped compact rows')

          row_pattern = re.compile(r'@Composable\ninternal fun BankCompactTransactionRow\(transaction: BankTransaction, onClick: \(\) -> Unit\) \{.*?\n\}\n\n@Composable\nprivate fun BankTransactionDetailsScreen', re.S)
          row_replacement = '''private data class BankTransactionVisual(
    val icon: androidx.compose.ui.graphics.vector.ImageVector,
    val background: Color,
    val foreground: Color
)

private fun bankTransactionVisual(transaction: BankTransaction): BankTransactionVisual {
    val text = "${transaction.counterparty} ${transaction.purpose}".lowercase(Locale.GERMANY)
    return when {
        listOf("miete", "mieter", "kaution", "nebenkosten").any { it in text } || transaction.amount > 0 ->
            BankTransactionVisual(Icons.Default.Home, Color(0xFFDCFCE7), Color(0xFF16A34A))
        listOf("baumarkt", "hornbach", "obi", "toom", "bauhaus", "handwerk", "werkzeug").any { it in text } ->
            BankTransactionVisual(Icons.Default.Build, Color(0xFFEFF3F8), Color(0xFF64748B))
        listOf("stadtwerk", "strom", "gas", "wasser", "energie").any { it in text } ->
            BankTransactionVisual(Icons.Default.Person, Color(0xFFEFF3F8), Color(0xFF64748B))
        listOf("telekom", "vodafone", "telefon", "internet", "mobilfunk").any { it in text } ->
            BankTransactionVisual(Icons.Default.Description, Color(0xFFEFF3F8), Color(0xFF64748B))
        transaction.amount < 0 ->
            BankTransactionVisual(Icons.Default.ShoppingCart, Color(0xFFFEE2E2), Color(0xFFEF4444))
        else -> BankTransactionVisual(Icons.Default.AccountBalance, Color(0xFFEFF3F8), Color(0xFF64748B))
    }
}

@Composable
internal fun BankCompactTransactionRow(transaction: BankTransaction, onClick: () -> Unit) {
    val visual = bankTransactionVisual(transaction)
    Row(
        modifier = Modifier.fillMaxWidth().clickable(onClick = onClick).padding(horizontal = 12.dp, vertical = 9.dp),
        verticalAlignment = Alignment.CenterVertically
    ) {
        Box(
            modifier = Modifier.size(42.dp).clip(CircleShape).background(visual.background),
            contentAlignment = Alignment.Center
        ) {
            Icon(visual.icon, contentDescription = null, tint = visual.foreground, modifier = Modifier.size(23.dp))
        }
        Spacer(Modifier.size(10.dp))
        Column(Modifier.weight(1f)) {
            Text(
                transaction.counterparty.ifBlank { "Unbekannter Zahlungspartner" },
                fontWeight = FontWeight.Bold,
                color = DarkNavy,
                fontSize = 14.sp,
                maxLines = 1,
                overflow = TextOverflow.Ellipsis
            )
            Text(
                BankCompactUiPolicy.compactSubtitle(transaction),
                fontSize = 11.sp,
                color = SlateGray,
                maxLines = 1,
                overflow = TextOverflow.Ellipsis
            )
            BankStatusBadge(transaction.reconciliationStatus)
        }
        Spacer(Modifier.size(6.dp))
        Column(horizontalAlignment = Alignment.End) {
            Text(
                NumberFormatter.format(transaction.amount),
                fontWeight = FontWeight.Bold,
                fontSize = 14.sp,
                color = if (transaction.amount >= 0) EmeraldGreen else DarkNavy,
                maxLines = 1
            )
            Text(formatDate(transaction.bookingDate), fontSize = 10.sp, color = SlateGray)
            Text("›", fontSize = 21.sp, color = if (transaction.reconciliationStatus == BankReconciliationStatus.OPEN) AccentBlue else Color(0xFF94A3B8))
        }
    }
}

@Composable
private fun BankTransactionDetailsScreen'''
          s2, n = row_pattern.subn(row_replacement, s, count=1)
          if n != 1:
              raise SystemExit('Failed to replace compact row function')
          s = s2

          old_detail_icon = '''                        Box(Modifier.size(48.dp).clip(CircleShape).background(Color(0xFFF1F5F9)), contentAlignment = Alignment.Center) {
                            Icon(Icons.Default.AccountBalance, contentDescription = null, tint = SlateGray)
                        }'''
          new_detail_icon = '''                        val visual = bankTransactionVisual(transaction)
                        Box(Modifier.size(54.dp).clip(CircleShape).background(visual.background), contentAlignment = Alignment.Center) {
                            Icon(visual.icon, contentDescription = null, tint = visual.foreground, modifier = Modifier.size(28.dp))
                        }'''
          must_replace(old_detail_icon, new_detail_icon, 'detail transaction icon')

          must_replace('                    BankDetailLine("Buchungsdatum", formatDate(transaction.bookingDate))\n', '                    BankDetailLine("Buchungsdatum", formatDate(transaction.bookingDate), Icons.Default.CalendarMonth)\n', 'booking date icon')
          must_replace('                    if (transaction.valueDate.isNotBlank()) BankDetailLine("Valutadatum", formatDate(transaction.valueDate))\n', '                    if (transaction.valueDate.isNotBlank()) BankDetailLine("Valutadatum", formatDate(transaction.valueDate), Icons.Default.CalendarMonth)\n', 'value date icon')
          must_replace('                    if (transaction.purpose.isNotBlank()) BankDetailLine("Verwendungszweck", transaction.purpose)\n', '                    if (transaction.purpose.isNotBlank()) BankDetailLine("Verwendungszweck", transaction.purpose, Icons.Default.Description)\n', 'purpose icon')
          must_replace('                    if (transaction.bankReference.isNotBlank()) BankDetailLine("Referenz", transaction.bankReference)\n', '                    if (transaction.bankReference.isNotBlank()) BankDetailLine("Referenz", transaction.bankReference, Icons.Default.Description)\n', 'reference icon')
          must_replace('                    BankDetailLine("Konto", buildString {\n', '                    BankDetailLine("Konto", buildString {\n', 'account line anchor')
          s = s.replace('                    })\n                }\n            }\n        }\n        item {\n            Row(Modifier.fillMaxWidth()', '                    }, Icons.Default.AccountBalance)\n                }\n            }\n        }\n        item {\n            Row(Modifier.fillMaxWidth()', 1)

          detail_line_pattern = re.compile(r'@Composable\nprivate fun BankDetailLine\(label: String, value: String\) \{.*?\n\}', re.S)
          detail_line_replacement = '''@Composable
private fun BankDetailLine(label: String, value: String, icon: androidx.compose.ui.graphics.vector.ImageVector) {
    Row(Modifier.fillMaxWidth().padding(vertical = 2.dp), verticalAlignment = Alignment.Top) {
        Icon(icon, contentDescription = null, tint = Color(0xFF64748B), modifier = Modifier.size(18.dp))
        Spacer(Modifier.size(10.dp))
        Text(label, modifier = Modifier.weight(0.34f), fontSize = 11.sp, color = SlateGray)
        Text(value, modifier = Modifier.weight(0.66f), fontSize = 12.sp, color = DarkNavy)
    }
}'''
          s2, n = detail_line_pattern.subn(detail_line_replacement, s, count=1)
          if n != 1:
              raise SystemExit('Failed to replace detail line')
          s = s2

          old_money = '            Text(NumberFormatter.format(amount), fontWeight = FontWeight.Bold, fontSize = 11.sp, color = if (positiveStyle) EmeraldGreen else CrimsonRed, maxLines = 1)'
          new_money = '''            val amountColor = when (title) {
                "Eingänge" -> EmeraldGreen
                "Ausgänge" -> CrimsonRed
                "Saldo" -> AccentBlue
                else -> if (positiveStyle) EmeraldGreen else CrimsonRed
            }
            Text(NumberFormatter.format(amount), fontWeight = FontWeight.Bold, fontSize = 11.sp, color = amountColor, maxLines = 1)'''
          must_replace(old_money, new_money, 'summary colors')

          anchor = '''    receiptDetails?.let { receipt ->
        ReceiptDetailDialog(receipt = receipt, viewModel = viewModel, onDismiss = { receiptDetails = null })
    }
}'''
          replacement = '''    receiptDetails?.let { receipt ->
        ReceiptDetailDialog(receipt = receipt, viewModel = viewModel, onDismiss = { receiptDetails = null })
    }
    if (showImportDetails && !importStatus.isNullOrBlank()) {
        AlertDialog(
            onDismissRequest = { showImportDetails = false },
            title = { Text("Importdetails") },
            text = {
                Column(Modifier.heightIn(max = 460.dp).verticalScroll(rememberScrollState())) {
                    Text(importStatus.orEmpty(), fontSize = 11.sp, color = SlateGray)
                }
            },
            confirmButton = { TextButton(onClick = { showImportDetails = false }) { Text("Schließen") } }
        )
    }
}'''
          must_replace(anchor, replacement, 'import detail dialog')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/BankFeature.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/BankFeature.kt
          git commit -m "Bank & Belege: Referenzdesign exakt nachziehen"
          git push origin HEAD:bank-design-patch-runner
