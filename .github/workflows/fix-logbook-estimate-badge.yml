name: Fix logbook estimate badge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-logbook-estimate-badge.yml"

permissions:
  contents: write

jobs:
  fix-logbook-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply UI-only logbook badge fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          marker = 'text = "Entfernung:",'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Entfernung marker not found')

          row = 'Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {'
          row_pos = s.rfind(row, 0, pos)
          if row_pos < 0 or pos - row_pos > 500:
              raise SystemExit('Distance status row not found near Entfernung')
          s = s[:row_pos] + 'Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {' + s[row_pos + len(row):]

          badge_text = '''                            Text(\n                                text = sourceLabel,\n                                fontSize = 8.sp,\n                                color = sourceColor,\n                                fontWeight = FontWeight.Bold\n                            )'''
          badge_text_new = '''                            Text(\n                                text = sourceLabel,\n                                fontSize = 8.sp,\n                                color = sourceColor,\n                                fontWeight = FontWeight.Bold,\n                                maxLines = 1,\n                                softWrap = false\n                            )'''
          count = s.count(badge_text)
          if count != 1:
              raise SystemExit(f'sourceLabel text count={count}, expected=1')
          s = s.replace(badge_text, badge_text_new, 1)

          p.write_text(s, encoding='utf-8')
          if s == original:
              raise SystemExit('No changes applied')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "UI: Fahrtenbuch Status-Badge auf kleinen Displays korrigieren"
          git push origin HEAD:main

      - name: Prepare direct release files
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-logbook-ui-${SHORT_SHA}.apk"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "scope=UI-only logbook estimate badge"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Publish test APK directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: logbook-ui-${{ github.run_id }}
          name: Steuer-Assistent Fahrtenbuch UI-Fix
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-logbook-ui-*.apk
            build-info.txt
          fail_on_unmatched_files: true
