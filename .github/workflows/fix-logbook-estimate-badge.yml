name: Fix compact UI details

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-logbook-estimate-badge.yml"

permissions:
  contents: write

jobs:
  fix-compact-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply UI-only compact fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) QuickActionCard: keep icon left + text right on normal phones.
          # Vertical layout is reserved for truly tiny cards only.
          if 'val compactCard = maxWidth < 175.dp' in s:
              s = s.replace('val compactCard = maxWidth < 175.dp', 'val compactCard = maxWidth < 125.dp', 1)
              print('QuickActionCard compact threshold: 175 -> 125 dp')
          elif 'val compactCard = maxWidth < 125.dp' in s:
              print('QuickActionCard compact threshold already fixed')
          else:
              raise SystemExit('QuickActionCard compact threshold anchor not found')

          # Give long German labels enough room in horizontal cards without changing the design.
          old_horizontal_title = '''                            text = title,\n                            fontWeight = FontWeight.Bold,\n                            fontSize = 13.sp,\n                            lineHeight = 16.sp,\n                            color = DarkNavy,\n                            maxLines = 2,\n                            overflow = TextOverflow.Ellipsis'''
          new_horizontal_title = '''                            text = title,\n                            fontWeight = FontWeight.Bold,\n                            fontSize = if (title.length > 12) 11.sp else 13.sp,\n                            lineHeight = 16.sp,\n                            color = DarkNavy,\n                            maxLines = 2,\n                            overflow = TextOverflow.Ellipsis'''
          # There are two title blocks (vertical + horizontal). Replace the last occurrence only.
          idx = s.rfind(old_horizontal_title)
          if idx >= 0:
              s = s[:idx] + new_horizontal_title + s[idx + len(old_horizontal_title):]
              print('QuickActionCard long-title sizing: applied')
          elif new_horizontal_title in s:
              print('QuickActionCard long-title sizing already fixed')
          else:
              raise SystemExit('QuickActionCard horizontal title anchor not found')

          # 2) Fahrtenbuch: stack label + source badge instead of squeezing badge beside label.
          marker = 'text = "Entfernung:",'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Entfernung marker not found')

          row = 'Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {'
          column = 'Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {'
          row_pos = s.rfind(row, 0, pos)
          col_pos = s.rfind(column, 0, pos)
          if row_pos >= 0 and pos - row_pos <= 500:
              s = s[:row_pos] + column + s[row_pos + len(row):]
              print('Logbook source badge layout: Row -> Column')
          elif col_pos >= 0 and pos - col_pos <= 500:
              print('Logbook source badge layout already fixed')
          else:
              raise SystemExit('Distance source layout not found near Entfernung')

          badge_text = '''                            Text(\n                                text = sourceLabel,\n                                fontSize = 8.sp,\n                                color = sourceColor,\n                                fontWeight = FontWeight.Bold\n                            )'''
          badge_text_new = '''                            Text(\n                                text = sourceLabel,\n                                fontSize = 8.sp,\n                                color = sourceColor,\n                                fontWeight = FontWeight.Bold,\n                                maxLines = 1,\n                                softWrap = false\n                            )'''
          if badge_text in s:
              s = s.replace(badge_text, badge_text_new, 1)
              print('Logbook source badge single-line: applied')
          elif badge_text_new in s:
              print('Logbook source badge single-line already fixed')
          else:
              raise SystemExit('sourceLabel text anchor not found')

          if s == original:
              raise SystemExit('No changes required')
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified UI fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "UI: Startkarten und Fahrtenbuch auf kleinen Displays optimieren"
          git push origin HEAD:main

      - name: Prepare direct release files
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-compact-ui-${SHORT_SHA}.apk"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "scope=UI-only quick-action cards and logbook status badge"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Publish test APK directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compact-ui-${{ github.run_id }}
          name: Steuer-Assistent Kompakt-UI Testversion
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-compact-ui-*.apk
            build-info.txt
          fail_on_unmatched_files: true
