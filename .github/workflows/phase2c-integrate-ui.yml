name: Phase 2C UI integration

on:
  push:
    branches:
      - agent/bank-phase2c-loans-recurring

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2c-loans-recurring
          fetch-depth: 0
      - name: Wire Phase 2C UI and rule proposal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          vm = Path('app/src/main/java/com/example/ui/ReceiptViewModel.kt')
          s = vm.read_text()
          if 'import com.example.data.toEntity' not in s:
              s = s.replace('import com.example.data.PropertyMetadata\n', 'import com.example.data.PropertyMetadata\nimport com.example.data.toEntity\n', 1)
          if 'fun proposeBankRuleFromRecurringPattern(' not in s:
              marker = '    fun saveRecurringPattern(patternId: String) {'
              method = '''    fun proposeBankRuleFromRecurringPattern(patternId: String) {
                  viewModelScope.launch(Dispatchers.IO) {
                      val pattern = bankRecurringAnalysis.value.patterns.firstOrNull { it.patternId == patternId } ?: return@launch
                      if (pattern.occurrenceCount < com.example.data.BankRecurringThresholds.MIN_OCCURRENCES_FOR_PATTERN) {
                          _bankImportStatus.value = "Für einen Regelvorschlag fehlen noch bestätigende Vorkommen."
                          return@launch
                      }
                      val dao = database.bankLearningRuleDao()
                      val ruleId = "rule-rec-" + com.example.data.BankTransactionIdentity.sha256(pattern.patternId).take(24)
                      val existing = dao.getRule(ruleId)
                      if (existing?.state == com.example.data.BankRuleState.ACTIVE) {
                          _bankImportStatus.value = "Die passende Bankregel ist bereits aktiv."
                          return@launch
                      }
                      val now = java.time.Instant.now().toString()
                      val iban = pattern.normalizedCounterparty.removePrefix("iban:").takeIf { pattern.normalizedCounterparty.startsWith("iban:") }.orEmpty()
                      val counterparty = pattern.normalizedCounterparty.takeUnless { it.startsWith("iban:") }.orEmpty()
                      val terms = pattern.purposeFingerprint.split(' ').filter { it.length >= 3 }.take(6).joinToString("|")
                      val direction = if (pattern.direction == com.example.data.RecurringDirection.INCOME)
                          com.example.data.BankRuleDirection.INCOME else com.example.data.BankRuleDirection.EXPENSE
                      dao.upsertRule(
                          com.example.data.BankLearningRule(
                              ruleId = ruleId,
                              displayName = "Wiederkehrend: ${pattern.normalizedCounterparty.ifBlank { pattern.purposeFingerprint.ifBlank { "Bankzahlung" } }}",
                              enabled = false,
                              state = com.example.data.BankRuleState.PROPOSED,
                              ruleType = com.example.data.BankRuleType.COMBINED,
                              transactionDirection = direction,
                              counterpartyPattern = counterparty,
                              counterpartyIbanPattern = iban,
                              purposeTerms = terms,
                              amountMin = (pattern.typicalAmount - pattern.amountTolerance).coerceAtLeast(0.0),
                              amountMax = pattern.typicalAmount + pattern.amountTolerance,
                              currency = "EUR",
                              accountId = pattern.accountId,
                              propertyId = pattern.propertyId,
                              evidenceCount = pattern.occurrenceCount,
                              confidence = pattern.confidence,
                              source = com.example.data.BankRuleSource.USER_CREATED,
                              createdAt = existing?.createdAt?.ifBlank { now } ?: now,
                              updatedAt = now
                          )
                      )
                      _bankImportStatus.value = "Regelvorschlag erstellt. Er ist deaktiviert und muss in Bankregeln ausdrücklich aktiviert werden."
                  }
              }

          '''
              if marker not in s: raise SystemExit('saveRecurringPattern marker missing')
              s = s.replace(marker, method + marker, 1)
          vm.write_text(s)

          ui = Path('app/src/main/java/com/example/ui/BankFeature.kt')
          b = ui.read_text()
          if 'val phase2CLoanSuggestions by viewModel.bankLoanSuggestions.collectAsState()' not in b:
              b = b.replace(
                  'val rentSuggestions by viewModel.bankRentSuggestions.collectAsState()',
                  'val rentSuggestions by viewModel.bankRentSuggestions.collectAsState()\n    val phase2CLoanSuggestions by viewModel.bankLoanSuggestions.collectAsState()', 1)
              b = b.replace(
                  'var showRentMatching by remember { mutableStateOf(false) }',
                  'var showRentMatching by remember { mutableStateOf(false) }\n    var showPhase2C by remember { mutableStateOf(false) }', 1)
              old = '''    val accountsById = remember(accounts) { accounts.associateBy { it.accountId } }
              val loanSuggestions = remember(filteredTransactions, loans, accounts) {
                  filteredTransactions.mapNotNull { tx ->
                      BankLoanMatcher.suggestions(tx, loans, accountsById[tx.accountId], filteredTransactions)
                          .takeIf { it.isNotEmpty() }?.let { tx.transactionId to it }
                  }.toMap()
              }
          '''
              if old in b:
                  b = b.replace(old, '    val loanSuggestions = phase2CLoanSuggestions\n', 1)
              b = b.replace(
                  'OutlinedButton(onClick={ showRentMatching = !showRentMatching }, modifier=Modifier.fillMaxWidth()) { Text(if(showRentMatching) "Mietabgleich ausblenden" else "Mietabgleich") }',
                  'OutlinedButton(onClick={ showRentMatching = !showRentMatching }, modifier=Modifier.fillMaxWidth()) { Text(if(showRentMatching) "Mietabgleich ausblenden" else "Mietabgleich") }\n            OutlinedButton(onClick={ showPhase2C = !showPhase2C }, modifier=Modifier.fillMaxWidth()) { Text(if(showPhase2C) "Darlehen & Wiederkehrend ausblenden" else "Darlehen & Wiederkehrend") }', 1)
              b = b.replace(
                  'if (showRentMatching) { item { BankRentPanel(viewModel) } }',
                  'if (showRentMatching) { item { BankRentPanel(viewModel) } }\n        if (showPhase2C) { item { BankPhase2CPanel(viewModel) } }', 1)
          ui.write_text(b)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name xedox737
          git config user.email sergej-gerweck@web.de
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt
          git commit -m '[phase2c-ui] Wire loan and recurring review UI'
          git push origin HEAD:agent/bank-phase2c-loans-recurring
