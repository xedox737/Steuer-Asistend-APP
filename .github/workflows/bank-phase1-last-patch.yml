name: Bank Phase 1 Last Patch

on:
  push:
    branches:
      - agent/bank-phase1-last-patch-final

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded minimal patch
        run: python3 .github/scripts/bank_phase1_last_patch.py

      - name: Check patch hygiene
        run: |
          git diff --check
          git status --short

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run lintDebug
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Run testDebugUnitTest
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Run assembleDebug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified product patch and remove helpers
        run: |
          rm .github/scripts/bank_phase1_last_patch.py
          rm .github/workflows/bank-phase1-last-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close final Bank Phase 1 review and Room reimport gaps"
          git push origin HEAD:agent/bank-phase1-last-patch-final
