              'ExtractedReceipt payment field'
          )
          p = Path(gemini); s = p.read_text(encoding='utf-8')
          if '- zahlungsart:' not in s:
              s = s.replace(
                  '            - mieter: Name des Mieters/Zahlers, falls auf dem Beleg oder der Überweisung genannt (z. B. "Erika Mustermann", "Hans Peter"), sonst leeres String "".\n',
