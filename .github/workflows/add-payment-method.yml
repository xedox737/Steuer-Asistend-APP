      - name: Verify Room migration wiring
        shell: bash
        run: |
          grep -q 'version = 15' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'MIGRATION_14_15' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'zahlungsart TEXT NOT NULL DEFAULT' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'fun backfillPaymentMethods()' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'existing_payment_backfill_button' app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Lint
        timeout-minutes: 12
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Unit tests
        timeout-minutes: 12
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 12
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Feature: Zahlungsart erkennen und für Altbelege nacherkennen'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Zahlungsart-${{ steps.commit.outputs.short }}.apk"

      - name: Publish one test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payment-method-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Zahlungsart
          body: |
            Zahlungsart bei neuen Belegscans und sichere Nacherkennung für bestehende Belege.
            Room-Migration 14→15 erhält vorhandene Daten; unsichere Zahlungsarten bleiben Unbekannt.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Zahlungsart-*.apk
          fail_on_unmatched_files: true
