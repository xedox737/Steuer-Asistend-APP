          # ---------- OpenAI strict JSON schema ----------
          openai = 'app/src/main/java/com/example/api/OpenAiClient.kt'
          p = Path(openai); s = p.read_text(encoding='utf-8')
          if '"zahlungsart"' not in s[s.find('private fun receiptInstructions'):s.find('private data class EncodedImage')]:
              s = s.replace(
                  '        kontoNr enthält nur die vorgeschlagene Sachkontonummer. Keine steuerliche Freigabe erteilen.\n',
