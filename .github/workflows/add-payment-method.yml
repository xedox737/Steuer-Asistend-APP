              code = r'''    private fun normalizePaymentMethod(raw: String?): String {
        val value = raw.orEmpty().trim().lowercase(Locale.GERMANY)
        return when {
            value.isBlank() || value == "unbekannt" -> "Unbekannt"
            value.contains("paypal") -> "PayPal"
            value.contains("lastschrift") || value.contains("sepa debit") -> "Lastschrift"
            value.contains("überweisung") || value.contains("ueberweisung") || value.contains("sepa transfer") -> "Überweisung"
            value.contains("mastercard") || value.contains("visa") || value.contains("kreditkarte") || value.contains("credit card") -> "Kreditkarte"
            value.contains("girocard") || value.contains("maestro") || Regex("(^|[^a-z])ec([^a-z]|$)").containsMatchIn(value) -> "Girocard/EC"
            value.contains("bargeld") || Regex("(^|[^a-z])bar([^a-z]|$)").containsMatchIn(value) -> "Bar"
            else -> "Unbekannt"
        }
    }

    private fun inferPaymentMethodFromText(text: String): Pair<String, Double>? {
        val method = normalizePaymentMethod(text)
        return method.takeIf { it != "Unbekannt" }?.let { it to 0.78 }
    }

    private suspend fun analyzeExistingReceiptPaymentWithAi(receipt: Receipt): String? {
        val paths = receipt.imageUrl.split(',').map { it.trim() }.filter { it.isNotBlank() }
        val bitmaps = kotlinx.coroutines.withContext(Dispatchers.IO) {
            paths.mapNotNull { path ->
                runCatching {
                    val file = File(path)
                    if (file.exists() && file.isFile) BitmapFactory.decodeFile(file.absolutePath) else null
                }.getOrNull()
            }
        }
        if (bitmaps.isEmpty()) return null

        val providerState = _aiProviderState.value
        val learnedContext = getUserLearnedRulesPromptContext()
        return try {
            val extracted = when (providerState.provider) {
                ReceiptAnalysisProvider.GEMINI -> {
                    val key = AiProviderSettings.getGeminiKey(getApplication())
                    try {
                        GeminiClient.analyzeReceipt(
                            receiptText = "Ermittle insbesondere die Zahlungsart dieses bereits gespeicherten Belegs. Bei Unsicherheit Unbekannt.",
                            bitmaps = bitmaps,
                            userLearnedRulesContext = learnedContext,
                            apiKeyOverride = key
                        )
                    } finally {
                        key?.fill('\u0000')
                    }
                }
                ReceiptAnalysisProvider.OPENAI -> {
                    val key = AiProviderSettings.getOpenAiKey(getApplication()) ?: return null
                    try {
                        OpenAiClient.analyzeReceipt(
                            apiKey = key,
                            model = providerState.openAiModel,
                            receiptText = "Ermittle insbesondere die Zahlungsart dieses bereits gespeicherten Belegs. Bei Unsicherheit Unbekannt.",
                            bitmaps = bitmaps,
                            userLearnedRulesContext = learnedContext
                        )
                    } finally {
                        key.fill('\u0000')
                    }
                }
            }
            normalizePaymentMethod(extracted?.zahlungsart)
        } catch (e: Exception) {
            Log.w("ReceiptViewModel", "Zahlungsart-Nacherkennung für Beleg ${receipt.id} fehlgeschlagen", e)
            null
        } finally {
            bitmaps.forEach { bmp -> if (!bmp.isRecycled) bmp.recycle() }
        }
    }

    fun backfillPaymentMethods() {
        if (_isBackfillingPaymentMethods.value) return
        viewModelScope.launch {
            _isBackfillingPaymentMethods.value = true
            _paymentBackfillStatus.value = "Nacherkennung wird vorbereitet …"
            try {
                val candidates = receipts.value.filter { normalizePaymentMethod(it.zahlungsart) == "Unbekannt" }
                var updatedCount = 0
                var unknownCount = 0
                candidates.forEachIndexed { index, receipt ->
                    _paymentBackfillStatus.value = "Prüfe Beleg ${index + 1} von ${candidates.size} …"

                    val localText = listOf(receipt.aussteller, receipt.beschreibung, receipt.positionenJson).joinToString(" ")
                    var detected = inferPaymentMethodFromText(localText)
                    var source = "TEXT_HEURISTIK"

                    if (detected == null) {
                        val matchedBankItem = _bankStatementResult.value?.items?.firstOrNull {
                            it.matchedReceiptId == receipt.id.toLong()
                        }
                        val bankText = matchedBankItem?.let { "${it.counterparty} ${it.purpose} ${it.notes}" }.orEmpty()
                        detected = inferPaymentMethodFromText(bankText)?.let { it.first to 0.88 }
                        if (detected != null) source = "BANKABGLEICH"
                    }

                    if (detected == null) {
                        val aiMethod = analyzeExistingReceiptPaymentWithAi(receipt)
                        if (aiMethod != null && aiMethod != "Unbekannt") {
                            detected = aiMethod to 0.92
                            source = "KI_NACHERKANNT"
                        }
                    }

                    if (detected != null) {
                        val updated = receipt.copy(
                            zahlungsart = detected.first,
                            zahlungsartQuelle = source,
                            zahlungsartConfidence = detected.second,
                            syncStatus = if (receipt.syncStatus == "SYNCED") "PENDING" else receipt.syncStatus
                        )
                        repository.insert(updated)
                        if (FirestoreService.isCloudActive()) FirestoreService.saveReceipt(updated)
                        updatedCount++
                    } else {
                        unknownCount++
                    }
                }
                if (_isDriveConnected.value && _autoDriveBackup.value && updatedCount > 0) {
                    runCatching { syncAllToDrive() }
                }
                _paymentBackfillStatus.value = "Fertig: $updatedCount Zahlungsarten erkannt, $unknownCount bleiben Unbekannt."
            } catch (e: Exception) {
                Log.e("ReceiptViewModel", "Zahlungsart-Nacherkennung fehlgeschlagen", e)
                _paymentBackfillStatus.value = "Nacherkennung fehlgeschlagen: ${e.localizedMessage ?: "unbekannter Fehler"}"
            } finally {
                _isBackfillingPaymentMethods.value = false
            }
        }
    }

'''
