                  1
              )
              payment_card = '''            Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                Text("Zahlungsart", fontWeight = FontWeight.Bold, color = DarkNavy, fontSize = 13.sp)
                Text("Von der KI erkannt – bitte kurz prüfen.", color = Color.Gray, fontSize = 10.sp)
