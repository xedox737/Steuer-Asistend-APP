name: Zahlungsart implementieren

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-payment-method.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Implement payment method support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # ---------- Room model + safe migration 14 -> 15 ----------
          db = 'app/src/main/java/com/example/data/ReceiptDatabase.kt'
          replace_once(
              db,
              '    val mieter: String = "", // Mieter name\n    val isArchivedToDrive: Boolean = false,',
              '    val mieter: String = "", // Mieter name\n    val zahlungsart: String = "Unbekannt", // Bar, Girocard/EC, Kreditkarte, Überweisung, Lastschrift, PayPal, Unbekannt\n    val zahlungsartQuelle: String = "UNBEKANNT", // KI_SCAN, NUTZER_BESTAETIGT, KI_NACHERKANNT, BANKABGLEICH, TEXT_HEURISTIK, MANUELL, UNBEKANNT\n    val zahlungsartConfidence: Double = 0.0,\n    val isArchivedToDrive: Boolean = false,',
              'Receipt payment fields'
          )
          p = Path(db); s = p.read_text(encoding='utf-8')
          if 'val MIGRATION_14_15' not in s:
              anchor = '@Database(entities = [Receipt::class, PropertyMetadata::class, ReceiptEntity::class, Beleg::class, ExportAuditRun::class, ReceiptDocumentReference::class], version = 14, exportSchema = false)'
              migration = '''val MIGRATION_14_15 = object : androidx.room.migration.Migration(14, 15) {
    override fun migrate(db: androidx.sqlite.db.SupportSQLiteDatabase) {
        // Preserve every existing receipt. Payment method starts unknown and can be backfilled later.
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsart TEXT NOT NULL DEFAULT 'Unbekannt'")
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsartQuelle TEXT NOT NULL DEFAULT 'UNBEKANNT'")
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsartConfidence REAL NOT NULL DEFAULT 0.0")
    }
}

@Database(entities = [Receipt::class, PropertyMetadata::class, ReceiptEntity::class, Beleg::class, ExportAuditRun::class, ReceiptDocumentReference::class], version = 15, exportSchema = false)'''
              if anchor not in s: raise SystemExit('Database v14 anchor not found')
              s = s.replace(anchor, migration, 1)
              s = s.replace('.addMigrations(MIGRATION_10_11, MIGRATION_11_12, MIGRATION_12_13, MIGRATION_13_14)', '.addMigrations(MIGRATION_10_11, MIGRATION_11_12, MIGRATION_12_13, MIGRATION_13_14, MIGRATION_14_15)', 1)
