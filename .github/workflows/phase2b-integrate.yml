name: Phase 2B persistence integration

on:
  push:
    branches:
      - agent/bank-phase2b-rent-matching
    paths:
      - .github/workflows/phase2b-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2b-rent-matching
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Apply Phase 2B persistence patch
        run: python3 .github/scripts/phase2b_apply.py
      - name: Create local debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Verify full Android chain
        run: |
          gradle lintDebug --stacktrace --no-daemon
          gradle testDebugUnitTest --stacktrace --no-daemon
          gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/phase2b_apply.py .github/workflows/phase2b-integrate.yml
          git add -A
          git commit -m "Integrate Phase 2B rent assignment persistence"
          git push origin HEAD:agent/bank-phase2b-rent-matching
