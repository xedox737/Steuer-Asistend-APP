name: Drive Beschreibung Fix Run Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drive-description-run-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply Drive description fix
        run: python3 .github/scripts/drive_description_fix.py

      - name: Verify fix markers
        shell: bash
        run: |
          git diff --check
          grep -q 'put("beschreibung", beschreibung' app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          grep -q 'beschreibung = currentReceipt.beschreibung' app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          grep -q 'beschreibung = beschreibung ?: ""' app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          grep -q 'descriptionMatch = downloadedPersisted.beschreibung == updatedLocal.beschreibung' app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          if grep -q 'beschreibung = aussteller ?: ""' app/src/main/java/com/example/data/DrivePersistenceRepository.kt; then
            echo "Invalid restore fallback still present"
            exit 1
          fi

      - name: Compile Kotlin
        timeout-minutes: 10
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified fix and clean temporary CI files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          git rm .github/scripts/drive_description_fix.py \
                 .github/workflows/drive-description-fix.yml \
                 .github/workflows/drive-description-run-once.yml
          git commit -m "Fix: Belegbeschreibung in Drive sichern und wiederherstellen"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Drive-Beschreibung-${{ steps.commit.outputs.short }}.apk"

      - name: Publish one test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drive-description-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Drive Beschreibung Fix
          body: |
            Belegbeschreibung wird in Drive-Metadaten gespeichert und beim Restore korrekt wiederhergestellt. Alte Backups ohne Beschreibung bleiben kompatibel.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Drive-Beschreibung-*.apk
