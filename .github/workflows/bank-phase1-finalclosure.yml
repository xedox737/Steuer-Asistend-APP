name: Bank Phase 1 Final Closure

on:
  push:
    branches:
      - agent/bank-phase1-finalclosure-20260907
    paths:
      - ".github/scripts/bank_phase1_finalclosure.py"
      - ".github/workflows/bank-phase1-finalclosure.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/bank-phase1-finalclosure-20260907
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply guarded final closure patch
        run: |
          python3 .github/scripts/bank_phase1_finalclosure.py
          git diff --check
          git diff --stat

      - name: lintDebug
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: testDebugUnitTest
        timeout-minutes: 12
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: assembleDebug
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "Finish bank phase 1 acceptance checklist"
          git push origin HEAD:agent/bank-phase1-finalclosure-20260907

      - name: Prepare traceable branch APK
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-bank-phase1-final-${SHORT_SHA}.apk"
          {
            echo "commit=${FULL_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > bank-phase1-final-build-info.txt

      - name: Upload branch verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-phase1-final-branch
          path: |
            Steuer-Assistent-bank-phase1-final-*.apk
            bank-phase1-final-build-info.txt
          if-no-files-found: error
