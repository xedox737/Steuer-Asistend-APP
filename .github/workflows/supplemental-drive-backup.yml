name: Vollständiges Drive Backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_supplemental_drive_backup_patch.py"
      - ".github/workflows/supplemental-drive-backup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply supplemental Drive backup integration
        run: python3 .github/workflows/_supplemental_drive_backup_patch.py

      - name: Verify markers
        shell: bash
        run: |
          git diff --check
          grep -q 'object SupplementalDriveBackup' app/src/main/java/com/example/data/SupplementalDriveBackup.kt
          grep -q 'SupplementalDriveBackup.backup' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'SupplementalDriveBackup.restore' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'LoanManagementSection(viewModel)' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q 'fun LoanManagementSection(viewModel: ReceiptViewModel)' app/src/main/java/com/example/ui/LoanFeature.kt
          grep -q 'viewModel.syncAllToDrive()' app/src/main/java/com/example/ui/LoanFeature.kt

      - name: Compile Kotlin
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/SupplementalDriveBackup.kt \
                  app/src/main/java/com/example/ui/ReceiptViewModel.kt \
                  app/src/main/java/com/example/ui/LoanFeature.kt \
                  app/src/main/java/com/example/ui/ReceiptAppUi.kt \
                  app/src/main/java/com/example/ui/RentIncomeFeature.kt \
                  app/src/main/java/com/example/ui/RentTenantWrapper.kt
          git rm -f .github/workflows/_supplemental_drive_backup_patch.py .github/workflows/supplemental-drive-backup.yml
          git commit -m "Feature: Miet- und Darlehensdaten vollständig in Drive sichern [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Drive-Backup-${{ steps.commit.outputs.short }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drive-backup-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Drive Backup vollständig
          body: |
            - Darlehen werden in Google Drive gesichert und wiederhergestellt
            - Schuldzins-Zuordnungen werden gesichert
            - Mietplan mit NK und sonstigen Mietbestandteilen wird gesichert
            - komplette Mieterhistorie/Mieterwechsel wird gesichert
            - bestehende Objekt-, Wohneinheiten-, Beleg- und DATEV-Sicherung bleibt erhalten
            - Änderungen an Darlehen und Mietdaten stoßen automatisch den Drive-Sync an
            - API-Schlüssel und Google-Anmeldetokens werden nicht im Backup gespeichert
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Drive-Backup-*.apk
