name: One-shot Bank backup and reimport preservation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bank-classification-phase-a
    paths:
      - '.github/workflows/one-shot-bank-backup-reimport.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bank-classification-phase-a
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create local debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -storetype PKCS12 -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Apply bank backup and reimport patch
        run: |
          python .github/scripts/apply_bank_backup_classification.py
          git diff --check
      - name: Lint
        run: gradle lintDebug
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Commit verified backup patch
        run: |
          if git diff --quiet -- app/src/main/java/com/example/data/SupplementalDriveBackup.kt app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt app/src/test/java/com/example/data/BankCamtV8ReimportStatusAcceptanceTest.kt; then
            echo "No backup diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/SupplementalDriveBackup.kt app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt app/src/test/java/com/example/data/BankCamtV8ReimportStatusAcceptanceTest.kt
          git commit -m "Preserve bank classification in backup and reimport"
          git pull --rebase origin feature/bank-classification-phase-a
          git push origin HEAD:feature/bank-classification-phase-a
