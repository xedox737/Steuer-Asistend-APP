name: Phase 2C database integration

on:
  push:
    branches:
      - agent/bank-phase2c-loans-recurring

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2c-loans-recurring
          fetch-depth: 0
      - name: Integrate and verify Room 27
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/data/ReceiptDatabase.kt')
          s = p.read_text()
          if 'MIGRATION_26_27' not in s:
              raise SystemExit('Room 27 migration is missing')
          for required in ['version = 27', 'BankLoanAssignment::class', 'BankRecurringPattern::class', 'bankLoanAssignmentDao()', 'bankRecurringPatternDao()', 'MIGRATION_26_27)']:
              if required not in s: raise SystemExit('database integration missing: ' + required)

          t = Path('app/src/test/java/com/example/data/BankMigration24AcceptanceTest.kt')
          x = t.read_text()
          x = x.replace('@Test fun freshDatabaseIsVersion26() {', '@Test fun freshDatabaseIsVersion27() {')
          x = x.replace('assertEquals(26, database.openHelper.writableDatabase.version)', 'assertEquals(27, database.openHelper.writableDatabase.version)')
          if 'migration26To27CreatesLoanAndRecurringTables' not in x:
              marker = '    @Test fun freshDatabaseIsVersion27() {'
              test = '''    @Test fun migration26To27CreatesLoanAndRecurringTables() = withDb(26) { db ->
                  MIGRATION_26_27.migrate(db)
                  assertTrue(columns(db, "bank_loan_assignments").containsAll(setOf("assignmentId", "transactionId", "loanId", "paymentType", "period", "splitStatus")))
                  assertTrue(columns(db, "bank_recurring_patterns").containsAll(setOf("patternId", "enabled", "cadence", "typicalAmount", "confidence", "nextExpectedStart", "nextExpectedEnd")))
              }

          '''
              if marker not in x: raise SystemExit('fresh DB test marker missing')
              x = x.replace(marker, test + marker, 1)
          t.write_text(x)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name xedox737
          git config user.email sergej-gerweck@web.de
          git add app/src/test/java/com/example/data/BankMigration24AcceptanceTest.kt
          git commit -m '[phase2c-db] Verify migration 26 to 27 and fresh install'
          git push origin HEAD:agent/bank-phase2c-loans-recurring
