name: Temporary source export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Package source
        run: tar --exclude=.git -czf steuer-assistent-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: steuer-assistent-source
          path: steuer-assistent-source.tar.gz
          if-no-files-found: error
