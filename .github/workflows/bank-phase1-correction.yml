name: Bank phase 1 correction verifier

on:
  push:
    branches: ["agent/bank-phase1-corrections-v2"]
    paths:
      - ".github/correction-patches/bank-phase1.patch"

concurrency:
  group: bank-phase1-correction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4

      - name: Apply guarded correction patch
        run: |
          git apply --check .github/correction-patches/bank-phase1.patch
          git apply .github/correction-patches/bank-phase1.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified correction
        run: |
          rm -f .github/correction-patches/bank-phase1.patch
          rm -f .github/workflows/bank-phase1-correction.yml
          rmdir .github/correction-patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete bank phase 1 corrections"
          git push origin HEAD:${GITHUB_REF_NAME}
