name: Wire restore upsert

on:
  push:
    branches:
      - agent/safe-duplicate-purge
    paths:
      - tools/wire_restore_upsert.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safe-duplicate-purge
          fetch-depth: 0
      - name: Apply restore upsert migration
        run: python3 tools/wire_restore_upsert.py
      - name: Commit repository change
        run: |
          if git diff --quiet; then
            echo "No repository change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/DrivePersistenceRepository.kt
          git commit -m "Use duplicate-safe upsert during Drive restore"
          git push origin HEAD:agent/safe-duplicate-purge
