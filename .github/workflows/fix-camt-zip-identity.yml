name: Fix CAMT ZIP identity

on:
  push:
    branches:
      - agent/camt052-053-v8-zip-import
    paths:
      - .github/scripts/fix_camt_zip_identity.py
      - .github/workflows/fix-camt-zip-identity.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[camt-zip-identity-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/camt052-053-v8-zip-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_camt_zip_identity.py
      - name: Commit identity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/BankImportV8.kt app/src/test/java/com/example/data/BankCamtZipV8AcceptanceTest.kt app/src/test/java/com/example/data/BankCamtV8ReimportStatusAcceptanceTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix direct and ZIP CAMT identity parity [camt-zip-identity-fixed]"
          git push origin HEAD:agent/camt052-053-v8-zip-import
