name: Phase 2C regression fix

on:
  push:
    branches:
      - agent/bank-phase2c-loans-recurring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2c-loans-recurring
          fetch-depth: 0
      - name: Apply compatibility-safe matcher fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/data/BankPhase1FinalPolicies.kt')
          s = p.read_text()
          if 'score -= 40' not in s:
              print('matcher already patched; nothing to do')
              raise SystemExit(0)
          s = s.replace('score -= 40', 'score -= 20', 1)
          s = s.replace('Positive Bewegung ist keine normale Darlehensrate', 'Positive Bewegung ist keine normale Darlehensrate; als Korrektur/Erstattung prüfen', 1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name xedox737
          git config user.email sergej-gerweck@web.de
          git add app/src/main/java/com/example/data/BankPhase1FinalPolicies.kt
          git commit -m '[phase2c-fix] Preserve positive loan review suggestion'
          git push origin HEAD:agent/bank-phase2c-loans-recurring
