name: Android CI

# Security round 2 trigger
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove sensitive Gemini response logging
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/security-round-2'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/api/GeminiClient.kt")
          text = path.read_text(encoding="utf-8")
          replacements = [
              '                Log.d(TAG, "Raw Response from Gemini: $jsonText")\n',
              '                    Log.e(TAG, "JSON parsing error for cleaned response: $cleanedJson", pe)\n',
              '                Log.d(TAG, "Raw Distance Response: $jsonText")\n',
              '                Log.d(TAG, "Raw Natural Language Search Response: $jsonText")\n',
          ]
          changed = 0
          for old in replacements:
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f"Unexpected duplicate sensitive log: {old!r}")
              if count == 1:
                  text = text.replace(old, "")
                  changed += 1
          if changed == 0:
              print("Sensitive Gemini logs already removed")
          else:
              path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/api/GeminiClient.kt
          if ! git diff --cached --quiet; then
            git commit -m "Remove sensitive Gemini response logging"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      - name: Create local debug keystore when missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run lint and unit tests
        timeout-minutes: 12
        run: gradle lintDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
