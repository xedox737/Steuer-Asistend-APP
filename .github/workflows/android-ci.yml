name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      # A transient keystore is permitted for CI checks, never for an installable product release.
      # Configure PRODUCTION_DEBUG_KEYSTORE_BASE64 with the persistent debug.keystore bytes
      # (store/key password: android; alias: androiddebugkey).
      - name: Prepare product debug signing identity
        env:
          PRODUCTION_DEBUG_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_DEBUG_KEYSTORE_BASE64 }}
          PRODUCTION_DEBUG_SHA1: ${{ vars.PRODUCTION_DEBUG_SHA1 }}
        run: |
          if [ -n "$PRODUCTION_DEBUG_KEYSTORE_BASE64" ] && [ -n "$PRODUCTION_DEBUG_SHA1" ]; then
            python3 .github/scripts/prepare-product-signing.py
            echo "STABLE_PRODUCT_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Missing persistent keystore or approved SHA-1: CI-only APK. Publishing is disabled."
            echo "STABLE_PRODUCT_DEBUG_SIGNING=false" >> "$GITHUB_ENV"
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Test public APK certificate evidence parser
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Run lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      # Only JVM tests need Java 21 for Robolectric SDK 36. Android build,
      # lint, release and the emulator job keep the existing Java 17 runtime.
      - name: Set up Java 21 for Robolectric
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Each class now gets an isolated JVM; allow for measured startup work,
      # rather than masking an individual test failure or adding retries.
      - name: Run unit tests
        timeout-minutes: 20
        run: gradle testDebugUnitTest -Proborazzi.test.record=true --stacktrace --no-daemon

      - name: Verify actual test method execution
        if: always()
        run: python3 .github/scripts/verify-test-execution.py

      - name: Verify saved Phase 10B portfolio evidence
        if: always()
        run: python3 .github/scripts/phase10b-audit-evidence.py app/build app/build/reports/phase10b/audit-evidence.json

      - name: Verify repaired Drive portfolio contracts and actual methods
        if: always()
        run: python3 .github/scripts/e11a-verify-repair.py

      - name: Verify actual Issue 145 initialization regression execution
        if: always()
        run: python3 .github/scripts/phase11b-verify-initialization.py

      - name: Verify actual Issue 148 connection regression execution
        if: always()
        run: python3 .github/scripts/phase11c-verify-connection.py

      - name: Verify actual Phase11D native auth and consent regression execution
        if: always()
        run: python3 .github/scripts/phase11d-verify-auth.py

      - name: Preserve synthetic Phase 10B evidence
        if: always()
        run: python3 .github/scripts/phase10b-evidence.py

      - name: Restore Java 17 for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify actual APK identity and provider authorities
        run: python3 .github/scripts/e11a-inspect-apk.py app/build/outputs/apk/debug/app-debug.apk --package com.aistudio.steuerassistent.vnhqkp

      - name: Verify built persistent product certificate
        if: env.STABLE_PRODUCT_DEBUG_SIGNING == 'true'
        run: python3 .github/scripts/verify-product-update-identity.py

      - name: Prepare release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        timeout-minutes: 10
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      # Do not expose a transiently signed main-branch APK as an installable update.
      # PR artifacts remain available for isolated CI validation.
      - name: Upload debug APK
        if: success() && (github.ref != 'refs/heads/main' || env.STABLE_PRODUCT_DEBUG_SIGNING == 'true')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: success() && env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The sole automatic publisher runs only after BOTH CI jobs succeed.
      # Signed app-debug artifacts remain available; no parallel release can overwrite them.

  android-emulator-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      # Catch instrumentation compilation errors before paying for an emulator boot.
      - name: Build app and instrumentation APKs
        timeout-minutes: 15
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          set -euo pipefail
          mkdir -p app/build/emulator-e2e
          {
            id
            if [ -e /dev/kvm ]; then ls -l /dev/kvm; fi
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            # Wait for this device's udev event before checking its permissions.
            sudo timeout 15s udevadm trigger --name-match=kvm --settle
            ls -l /dev/kvm
            test -c /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          } 2>&1 | tee app/build/emulator-e2e/kvm-setup.txt

      - name: Run Android emulator end-to-end tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: immopilot-e2e
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash .github/scripts/run-android-emulator-e2e.sh

      - name: Preserve synthetic Phase 10B emulator execution evidence
        if: always()
        run: python3 .github/scripts/phase10b-evidence.py --emulator

      - name: Upload emulator reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/emulator-e2e/**
            app/build/reports/phase10b/emulator-ci-evidence-summary.json
          if-no-files-found: warn
          retention-days: 14
