name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Test Phase 11A evidence helpers
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_phase11a*.py' -v

      - name: Run lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      # Only JVM tests need Java 21 for Robolectric SDK 36. Android build,
      # lint, release and the emulator job keep the existing Java 17 runtime.
      - name: Set up Java 21 for Robolectric
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Each class now gets an isolated JVM; allow for measured startup work,
      # rather than masking an individual test failure or adding retries.
      - name: Run unit tests
        timeout-minutes: 20
        run: gradle testDebugUnitTest -Proborazzi.test.record=true --stacktrace --no-daemon

      - name: Verify actual test method execution
        if: always()
        run: python3 .github/scripts/verify-test-execution.py

      - name: Verify saved Phase 10B portfolio evidence
        if: always()
        run: python3 .github/scripts/phase10b-audit-evidence.py app/build app/build/reports/phase10b/audit-evidence.json

      - name: Verify Phase 11A snapshot and integrity plumbing
        if: always()
        run: python3 .github/scripts/phase11a-audit-ci.py

      - name: Preserve synthetic Phase 10B evidence
        if: always()
        run: python3 .github/scripts/phase10b-evidence.py

      - name: Restore Java 17 for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        timeout-minutes: 10
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Build unsigned release APK for QA when release signing is unavailable
        if: env.RELEASE_KEYSTORE_BASE64 == '' || env.RELEASE_STORE_PASSWORD == '' || env.RELEASE_KEY_PASSWORD == '' || env.RELEASE_KEY_ALIAS == ''
        timeout-minutes: 10
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify phone-only tools are absent from the actual release APK
        run: python3 .github/scripts/phase11a-check-ui-packaging.py

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: success() && env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_PASSWORD != '' && env.RELEASE_KEY_ALIAS != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare traceable debug release
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-debug-${SHORT_SHA}.apk"
          {
            echo "commit=${GITHUB_SHA}"
            echo "short_commit=${SHORT_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Publish current debug APK
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Steuer-Assistent Testversion ${{ github.run_number }}
          body: |
            Automatisch erzeugte Testversion aus Commit `${{ github.sha }}`.
            GitHub-Actions-Lauf: `${{ github.run_id }}`.
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true

  android-emulator-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      # Catch instrumentation compilation errors before paying for an emulator boot.
      - name: Build guarded production-ID reference for parallel sandbox proof
        timeout-minutes: 15
        run: |
          gradle -I .github/scripts/phase11a-reference.init.gradle assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon
          mkdir -p app/build/phase11a-reference
          cp app/build/outputs/apk/debug/app-debug.apk app/build/phase11a-reference/app-reference.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/phase11a-reference/app-reference-androidTest.apk

      - name: Build app and instrumentation APKs
        timeout-minutes: 15
        run: gradle assembleDebug assembleDebugAndroidTest processReleaseManifest --stacktrace --no-daemon

      - name: Inspect isolated and reference APK identities and provider authorities
        run: python3 .github/scripts/phase11a-inspect-apks.py

      - name: Upload matched isolated app and QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: phase11a-isolated-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/emulator-e2e/phase11a-isolation/apks.json
          if-no-files-found: error
          retention-days: 14

      - name: Download this run's Phase 10B fixture for QA instrumentation smoke
        uses: actions/download-artifact@v4
        with:
          name: android-reports
          path: app/build/phase11a-ci-input

      - name: Enable KVM
        run: |
          set -euo pipefail
          mkdir -p app/build/emulator-e2e
          {
            id
            if [ -e /dev/kvm ]; then ls -l /dev/kvm; fi
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            # Wait for this device's udev event before checking its permissions.
            sudo timeout 15s udevadm trigger --name-match=kvm --settle
            ls -l /dev/kvm
            test -c /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
          } 2>&1 | tee app/build/emulator-e2e/kvm-setup.txt

      - name: Run Android emulator end-to-end tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: immopilot-e2e
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash .github/scripts/run-android-emulator-e2e.sh

      - name: Preserve synthetic Phase 10B emulator execution evidence
        if: always()
        run: python3 .github/scripts/phase10b-evidence.py --emulator

      - name: Upload emulator reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/emulator-e2e/**
            app/build/reports/phase10b/emulator-ci-evidence-summary.json
          if-no-files-found: warn
          retention-days: 14
