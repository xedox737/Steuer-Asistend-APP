name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Android 7 compatible header read fix
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("app/src/main/java/com/example/ui/ReceiptAppUi.kt"),
              Path("app/src/main/java/com/example/ui/ReceiptViewModel.kt"),
          ]
          old = "it.readNBytes(16)"
          new = "run { val buffer = ByteArray(16); var offset = 0; while (offset < buffer.size) { val count = it.read(buffer, offset, buffer.size - offset); if (count < 0) break; offset += count }; buffer.copyOf(offset) }"

          changed = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed += occurrences
                  print(f"Patched {occurrences} occurrence(s) in {path}")

          if changed != 2:
              raise SystemExit(f"Expected exactly 2 readNBytes occurrences, found {changed}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt app/src/main/java/com/example/ui/ReceiptViewModel.kt
          git commit -m "Replace API 33-only readNBytes calls"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      - name: Create local debug keystore when missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Run lint and unit tests
        timeout-minutes: 12
        run: gradle lintDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
