name: Publish verified APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified app commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Require persistent original product signing identity
        env:
          PRODUCTION_DEBUG_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_DEBUG_KEYSTORE_BASE64 }}
          PRODUCTION_DEBUG_SHA1: ${{ vars.PRODUCTION_DEBUG_SHA1 }}
        run: python3 .github/scripts/prepare-product-signing.py

      - name: Build verified debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify built product APK identity before publication
        run: |
          python3 .github/scripts/e11a-inspect-apk.py app/build/outputs/apk/debug/app-debug.apk --package com.aistudio.steuerassistent.vnhqkp
          python3 .github/scripts/verify-product-update-identity.py

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Steuer-Assistent-debug-${GITHUB_SHA::7}.apk
          {
            echo "verified_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Automatisch aus dem aktuellen Hauptbranch gebaut"
          } > build-info.txt

      - name: Publish GitHub release directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.sha }}
          name: Steuer-Assistent Testversion ${{ github.run_number }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true
