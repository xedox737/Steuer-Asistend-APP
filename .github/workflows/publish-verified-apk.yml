name: Publish verified APK

on:
  workflow_run:
    workflows: ["Android CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      VERIFIED_PRODUCT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified app commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_PRODUCT_SHA }}

      - name: Require complete CI for the exact product commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/require-verified-product-ci.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Require persistent original product signing identity
        env:
          PRODUCTION_DEBUG_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_DEBUG_KEYSTORE_BASE64 }}
          PRODUCTION_DEBUG_SHA1: ${{ vars.PRODUCTION_DEBUG_SHA1 }}
        run: python3 .github/scripts/prepare-product-signing.py

      - name: Build verified debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify built product APK identity before publication
        run: |
          python3 .github/scripts/e11a-inspect-apk.py app/build/outputs/apk/debug/app-debug.apk --package com.aistudio.steuerassistent.vnhqkp
          python3 .github/scripts/verify-product-update-identity.py

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Steuer-Assistent-debug-${VERIFIED_PRODUCT_SHA::7}.apk
          {
            echo "verified_commit=${VERIFIED_PRODUCT_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=Dauerhafte Signatur; NEUINSTALLATION fuer alte Versionen 102/103 erforderlich"
          } > build-info.txt

      - name: Publish GitHub release directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ env.VERIFIED_PRODUCT_SHA }}
          name: Steuer-Assistent Testversion ${{ github.run_number }}
          body: |
            Vollstaendige Android-CI fuer Commit `${{ env.VERIFIED_PRODUCT_SHA }}` bestanden.
            Dauerhafte Zertifikat-SHA1: `18:76:FC:D5:F5:D3:65:26:FC:44:F3:BA:37:AA:6C:AC:AB:FB:D9:8D`.
            **NEUINSTALLATION fuer alte Versionen 102/103 erforderlich; kein direktes Update.**
            Bestehende Nutzer mit Daten duerfen nicht ohne gepruefte Sicherung deinstallieren.
            Google-OAuth muss denselben Fingerabdruck fuer die Original-Package-ID verwenden.
          prerelease: true
          make_latest: false
          target_commitish: ${{ env.VERIFIED_PRODUCT_SHA }}
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true
