name: Altbeleg Beschreibungsnacherkennung

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/legacy_description_backfill.py"
      - ".github/workflows/legacy-description-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply feature patch
        run: python3 .github/scripts/legacy_description_backfill.py

      - name: Verify feature markers
        shell: bash
        run: |
          git diff --check
          grep -q 'fun analyzeLegacyDescriptions()' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'fun applyDescriptionBackfill(receiptIds: Set<Int>)' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'downloadDocumentOnDemand(token, receipt)' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'legacy_description_backfill_button' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q 'Ausgewählte übernehmen' app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Compile Kotlin
        timeout-minutes: 12
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 12
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 12
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature and clean temporary CI files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt \
                  app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git rm .github/scripts/legacy_description_backfill.py \
                 .github/workflows/legacy-description-backfill.yml
          git commit -m "Feature: Altbeleg-Beschreibungen sicher nacherkennen"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Altbeleg-Beschreibung-${{ steps.commit.outputs.short }}.apk"

      - name: Publish one test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-description-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Altbeleg Beschreibung
          body: |
            Altbeleg-Beschreibungen sicher nacherkennen: Vorschau, sichere Vorauswahl, PDF/Bild-Analyse, Drive-On-Demand und ausschließliche Änderung von Beschreibung/Zweck.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Altbeleg-Beschreibung-*.apk
