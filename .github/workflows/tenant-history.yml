name: Mieterwechsel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tenant-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Link tenant-history screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          old = '''@Composable
          fun RentOverviewScreen(viewModel: ReceiptViewModel) {
              RentIncomeOverviewScreen(viewModel)
          }'''
          new = '''@Composable
          fun RentOverviewScreen(viewModel: ReceiptViewModel) {
              RentIncomeWithTenantHistoryScreen(viewModel)
          }'''
          if old not in s:
              raise SystemExit('RentOverviewScreen anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify markers
        run: |
          git diff --check
          grep -q 'RentIncomeWithTenantHistoryScreen(viewModel)' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q 'Mieterwechsel erfassen' app/src/main/java/com/example/ui/TenantHistoryFeature.kt
          grep -q 'ExtendedFloatingActionButton' app/src/main/java/com/example/ui/RentTenantWrapper.kt

      - name: Compile Kotlin
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt app/src/main/java/com/example/ui/TenantHistoryFeature.kt app/src/main/java/com/example/ui/RentTenantWrapper.kt
          git rm -f .github/workflows/tenant-history.yml
          git commit -m "Feature: Mieterwechsel und Mieterhistorie [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Mieterwechsel-${{ steps.commit.outputs.short }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tenant-history-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Mieterwechsel
          body: |
            - Mieterwechsel je Wohneinheit erfassen
            - Einzug und Auszug mit Datum
            - bisherige Mietverhältnisse bleiben als Historie erhalten
            - neue Kaltmiete, Nebenkosten und sonstige Mietbestandteile pro Mietverhältnis
            - aktueller Mieter und Mietplan werden nach dem Wechsel automatisch aktualisiert
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Mieterwechsel-*.apk
