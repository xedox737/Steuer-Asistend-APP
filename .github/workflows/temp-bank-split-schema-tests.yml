name: Apply Bank Split Schema Test Fixes
on:
  push:
    branches: [agent/bank-transaction-split]
    paths:
      - .github/scripts/fix_bank_split_schema_tests.py
      - .github/workflows/temp-bank-split-schema-tests.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-transaction-split
          fetch-depth: 0
      - name: Update schema expectations
        run: python .github/scripts/fix_bank_split_schema_tests.py
      - name: Remove temporary helpers
        run: git rm -f .github/scripts/fix_bank_split_schema_tests.py .github/workflows/temp-bank-split-schema-tests.yml
      - name: Commit
        run: |
          git config user.name "xedox737"
          git config user.email "sergej-gerweck@web.de"
          git add app/src/test
          git diff --cached --check
          git commit -m "Update bank split schema regression expectations"
          git push origin HEAD:agent/bank-transaction-split
