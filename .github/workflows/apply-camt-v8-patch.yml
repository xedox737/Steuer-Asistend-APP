name: Apply CAMT V8 integration patch

on:
  push:
    branches:
      - agent/camt052-053-v8-zip-import
    paths:
      - .github/scripts/apply_camt_v8_patch.py
      - .github/workflows/apply-camt-v8-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[camt-v8-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/camt052-053-v8-zip-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python .github/scripts/apply_camt_v8_patch.py
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/BankImportV8.kt app/src/test/java/com/example/data/BankCamtZipV8AcceptanceTest.kt
          git diff --cached --quiet && exit 0
          git commit -m "Harden CAMT V8 ZIP import limits [camt-v8-applied]"
          git push origin HEAD:agent/camt052-053-v8-zip-import
