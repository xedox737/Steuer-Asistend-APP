name: One-shot Bank explicit rule UI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bank-classification-phase-a
    paths:
      - '.github/workflows/one-shot-bank-explicit-rule-ui.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bank-classification-phase-a
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create local debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -storetype PKCS12 -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Apply explicit rule proposal UI patch
        run: |
          python .github/scripts/apply_bank_explicit_rule_ui.py
          git diff --check
      - name: Lint
        run: gradle lintDebug
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Commit verified patch
        run: |
          if git diff --quiet -- app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt; then
            echo "No application diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt
          git commit -m "Add opt-in bank rule proposal action"
          git push origin HEAD:feature/bank-classification-phase-a
