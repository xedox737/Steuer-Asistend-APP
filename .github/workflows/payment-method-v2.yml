          if launch_pos < 0: raise SystemExit('Scan auto-populate section not found')
          launch_end = s.find('    if (scanState is ScanUiState.Loading)', launch_pos)
          launch = s[launch_pos:launch_end]
          if 'editZahlungsart = extracted.zahlungsart' not in launch:
              anchor = '            editIsEigenleistung = extracted.isEigenleistungSanierung\n'
              if anchor not in launch: raise SystemExit('Scan AI result anchor not found')
              launch = launch.replace(anchor, anchor + '            editZahlungsart = extracted.zahlungsart.ifBlank { "Unbekannt" }\n', 1)
              s = s[:launch_pos] + launch + s[launch_end:]

          # Scan payment field before positions
          scan_start = s.find('// Form Fields for Manual review / Edit after extraction')
          marker_pos = s.find('            // Positionen Editor Section', scan_start)
          if marker_pos < 0: raise SystemExit('Scan position editor marker not found')
          nearby = s[max(scan_start, marker_pos-2500):marker_pos]
          if 'label = { Text("Zahlungsart") }' not in nearby:
              field = '''            OutlinedTextField(
