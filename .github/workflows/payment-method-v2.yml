name: Zahlungsart v2 implementieren

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/payment-method-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Implement payment method v2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # ---------- 1. Room model + safe migration ----------
          path = 'app/src/main/java/com/example/data/ReceiptDatabase.kt'
          s = Path(path).read_text(encoding='utf-8')
          if 'val zahlungsart: String = "Unbekannt"' not in s:
              s, n = re.subn(
                  r'(\s+val mieter: String = "", // Mieter name\n)',
                  r'\1    val zahlungsart: String = "Unbekannt", // Bar, Girocard/EC, Kreditkarte, Überweisung, Lastschrift, PayPal, Unbekannt\n    val zahlungsartQuelle: String = "UNBEKANNT",\n    val zahlungsartConfidence: Double = 0.0,\n',
                  s,
                  count=1
              )
              if n != 1: raise SystemExit('Receipt payment fields insertion failed')
          if 'val MIGRATION_14_15' not in s:
              marker = '@Database(entities = [Receipt::class, PropertyMetadata::class, ReceiptEntity::class, Beleg::class, ExportAuditRun::class, ReceiptDocumentReference::class], version = 14, exportSchema = false)'
              if marker not in s: raise SystemExit('Database v14 declaration not found')
              migration = '''val MIGRATION_14_15 = object : androidx.room.migration.Migration(14, 15) {
    override fun migrate(db: androidx.sqlite.db.SupportSQLiteDatabase) {
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsart TEXT NOT NULL DEFAULT 'Unbekannt'")
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsartQuelle TEXT NOT NULL DEFAULT 'UNBEKANNT'")
        db.execSQL("ALTER TABLE receipts ADD COLUMN zahlungsartConfidence REAL NOT NULL DEFAULT 0.0")
    }
}

@Database(entities = [Receipt::class, PropertyMetadata::class, ReceiptEntity::class, Beleg::class, ExportAuditRun::class, ReceiptDocumentReference::class], version = 15, exportSchema = false)'''
              s = s.replace(marker, migration, 1)
              mig_old = '.addMigrations(MIGRATION_10_11, MIGRATION_11_12, MIGRATION_12_13, MIGRATION_13_14)'
              mig_new = '.addMigrations(MIGRATION_10_11, MIGRATION_11_12, MIGRATION_12_13, MIGRATION_13_14, MIGRATION_14_15)'
              if mig_old not in s: raise SystemExit('Migration registration not found')
              s = s.replace(mig_old, mig_new, 1)
          write(path, s)

          # ---------- 2. Shared AI result model + Gemini prompt ----------
          path = 'app/src/main/java/com/example/api/GeminiClient.kt'
          s = Path(path).read_text(encoding='utf-8')
          if '@Json(name = "zahlungsart")' not in s:
              s, n = re.subn(
                  r'(\s+@Json\(name = "mieter"\) val mieter: String = "",\n)',
                  r'\1    @Json(name = "zahlungsart") val zahlungsart: String = "Unbekannt",\n',
                  s,
                  count=1
              )
              if n != 1: raise SystemExit('ExtractedReceipt payment field insertion failed')
          if 'Nur eindeutig erkennbare Zahlungsangaben' not in s:
              prompt_anchor = '            - isEigenleistungSanierung: true, falls es sich um einen Baumarkt-Materialbeleg handelt UND das Belegdatum zwischen 2025-10-01 and 2026-01-31 liegt. Sonst false.\n'
              prompt_line = '            - zahlungsart: Nur eindeutig erkennbare Zahlungsangaben verwenden. Erlaubt sind exakt "Bar", "Girocard/EC", "Kreditkarte", "Überweisung", "Lastschrift", "PayPal", "Unbekannt". BAR/BARGELD = Bar; EC/Girocard/Maestro = Girocard/EC; Visa/Mastercard/Kreditkarte = Kreditkarte. Wenn nicht eindeutig, immer Unbekannt.\n'
              if prompt_anchor in s:
                  s = s.replace(prompt_anchor, prompt_anchor + prompt_line, 1)
              json_anchor = '              "mieter": "Erika Mustermann",\n'
              if json_anchor in s:
                  s = s.replace(json_anchor, json_anchor + '              "zahlungsart": "Girocard/EC",\n', 1)
          write(path, s)

          # ---------- 3. OpenAI strict schema ----------
          path = 'app/src/main/java/com/example/api/OpenAiClient.kt'
          s = Path(path).read_text(encoding='utf-8')
          schema_start = s.find('private fun receiptSchema()')
          schema_end = s.find('private data class EncodedImage', schema_start)
          if schema_start < 0 or schema_end < 0: raise SystemExit('OpenAI receipt schema section not found')
          schema = s[schema_start:schema_end]
          if '.put("zahlungsart"' not in schema:
              schema = schema.replace(
                  '            .put("mieter", stringSchema())\n',
                  '            .put("mieter", stringSchema())\n            .put("zahlungsart", stringSchema().put("enum", JSONArray(listOf("Bar", "Girocard/EC", "Kreditkarte", "Überweisung", "Lastschrift", "PayPal", "Unbekannt"))))\n',
                  1
              )
              schema = schema.replace(
                  '                        "wohneinheit", "mieter", "positionen"',
                  '                        "wohneinheit", "mieter", "zahlungsart", "positionen"',
                  1
              )
              s = s[:schema_start] + schema + s[schema_end:]
          instruction = '        zahlungsart darf nur "Bar", "Girocard/EC", "Kreditkarte", "Überweisung", "Lastschrift", "PayPal" oder "Unbekannt" sein. Nur eindeutig sichtbare Angaben verwenden, sonst "Unbekannt".\n'
          if instruction.strip() not in s:
              anchor = '        kontoNr enthält nur die vorgeschlagene Sachkontonummer. Keine steuerliche Freigabe erteilen.\n'
              if anchor in s:
                  s = s.replace(anchor, anchor + instruction, 1)
          write(path, s)

          # ---------- 4. ViewModel save + safe backfill ----------
          path = 'app/src/main/java/com/example/ui/ReceiptViewModel.kt'
          s = Path(path).read_text(encoding='utf-8')
          save_marker = '    // Save extracted receipt to database\n'
          if save_marker not in s: raise SystemExit('ViewModel save marker not found')
          if 'val isBackfillingPaymentMethods = _isBackfillingPaymentMethods.asStateFlow()' not in s:
              block = '''    private val _isBackfillingPaymentMethods = MutableStateFlow(false)
    val isBackfillingPaymentMethods = _isBackfillingPaymentMethods.asStateFlow()
    private val _paymentBackfillStatus = MutableStateFlow<String?>(null)
    val paymentBackfillStatus = _paymentBackfillStatus.asStateFlow()

    private fun normalizePaymentMethod(raw: String?): String {
        val value = raw.orEmpty().trim().lowercase(Locale.GERMANY)
        return when {
            value.isBlank() || value == "unbekannt" -> "Unbekannt"
            value.contains("paypal") -> "PayPal"
            value.contains("lastschrift") || value.contains("sepa debit") -> "Lastschrift"
            value.contains("überweisung") || value.contains("ueberweisung") || value.contains("sepa transfer") -> "Überweisung"
            value.contains("mastercard") || value.contains("visa") || value.contains("kreditkarte") || value.contains("credit card") -> "Kreditkarte"
            value.contains("girocard") || value.contains("maestro") || Regex("(^|[^a-z])ec([^a-z]|$)").containsMatchIn(value) -> "Girocard/EC"
            value.contains("bargeld") || Regex("(^|[^a-z])bar([^a-z]|$)").containsMatchIn(value) -> "Bar"
            else -> "Unbekannt"
        }
    }

    private fun inferPaymentMethodFromReceiptText(receipt: Receipt): Pair<String, Double>? {
        val text = listOf(receipt.aussteller, receipt.beschreibung, receipt.positionenJson).joinToString(" ")
        val method = normalizePaymentMethod(text)
        return method.takeIf { it != "Unbekannt" }?.let { it to 0.78 }
    }

    private suspend fun analyzeExistingPaymentMethodWithAi(receipt: Receipt): String? {
        val paths = receipt.imageUrl.split(',').map { it.trim() }.filter { it.isNotBlank() }
        val bitmaps = kotlinx.coroutines.withContext(Dispatchers.IO) {
            paths.mapNotNull { path ->
                runCatching {
                    val file = File(path)
                    if (file.exists() && file.isFile) BitmapFactory.decodeFile(file.absolutePath) else null
                }.getOrNull()
            }
        }
        if (bitmaps.isEmpty()) return null
        val learnedContext = getUserLearnedRulesPromptContext()
        return try {
            val result = when (_aiProviderState.value.provider) {
                ReceiptAnalysisProvider.GEMINI -> {
                    val key = AiProviderSettings.getGeminiKey(getApplication())
                    try {
                        GeminiClient.analyzeReceipt(
                            receiptText = "Bestimme insbesondere die Zahlungsart. Wenn sie nicht eindeutig erkennbar ist, setze Unbekannt.",
                            bitmaps = bitmaps,
                            userLearnedRulesContext = learnedContext,
                            apiKeyOverride = key
                        )
                    } finally { key?.fill('\\u0000') }
                }
                ReceiptAnalysisProvider.OPENAI -> {
                    val key = AiProviderSettings.getOpenAiKey(getApplication()) ?: return null
                    try {
                        OpenAiClient.analyzeReceipt(
                            apiKey = key,
                            model = _aiProviderState.value.openAiModel,
                            receiptText = "Bestimme insbesondere die Zahlungsart. Wenn sie nicht eindeutig erkennbar ist, setze Unbekannt.",
                            bitmaps = bitmaps,
                            userLearnedRulesContext = learnedContext
                        )
                    } finally { key.fill('\\u0000') }
                }
            }
            normalizePaymentMethod(result?.zahlungsart)
        } catch (e: Exception) {
            Log.w("ReceiptViewModel", "Zahlungsart-Nacherkennung für Beleg ${receipt.id} fehlgeschlagen", e)
            null
        } finally {
            bitmaps.forEach { if (!it.isRecycled) it.recycle() }
        }
    }

    fun backfillPaymentMethods() {
        if (_isBackfillingPaymentMethods.value) return
        viewModelScope.launch {
            _isBackfillingPaymentMethods.value = true
            try {
                val candidates = receipts.value.filter { normalizePaymentMethod(it.zahlungsart) == "Unbekannt" }
                var updated = 0
                candidates.forEachIndexed { index, receipt ->
                    _paymentBackfillStatus.value = "Prüfe Beleg ${index + 1} von ${candidates.size} …"
                    var detected = inferPaymentMethodFromReceiptText(receipt)
                    var source = "TEXT_HEURISTIK"
                    if (detected == null) {
                        val aiMethod = analyzeExistingPaymentMethodWithAi(receipt)
                        if (aiMethod != null && aiMethod != "Unbekannt") {
                            detected = aiMethod to 0.92
                            source = "KI_NACHERKANNT"
                        }
                    }
                    if (detected != null) {
                        repository.insert(receipt.copy(
                            zahlungsart = detected.first,
                            zahlungsartQuelle = source,
                            zahlungsartConfidence = detected.second,
                            syncStatus = if (receipt.syncStatus == "SYNCED") "PENDING" else receipt.syncStatus
                        ))
                        updated++
                    }
                }
                _paymentBackfillStatus.value = "Fertig: $updated von ${candidates.size} Belegen mit Zahlungsart ergänzt."
            } catch (e: Exception) {
                Log.e("ReceiptViewModel", "Zahlungsart-Nacherkennung fehlgeschlagen", e)
                _paymentBackfillStatus.value = "Nacherkennung fehlgeschlagen: ${e.localizedMessage}"
            } finally {
                _isBackfillingPaymentMethods.value = false
            }
        }
    }

'''
              s = s.replace(save_marker, block + save_marker, 1)

          save_start = s.find('    fun saveReceipt(')
          save_end = s.find('    // Update an existing receipt', save_start)
          if save_start < 0 or save_end < 0: raise SystemExit('saveReceipt section not found')
