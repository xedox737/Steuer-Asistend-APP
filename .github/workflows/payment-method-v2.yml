      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature
        id: commit_feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/ReceiptDatabase.kt app/src/main/java/com/example/api/GeminiClient.kt app/src/main/java/com/example/api/OpenAiClient.kt app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "Feature: Zahlungsart bei Belegen erfassen und nacherkennen"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Zahlungsart-${{ steps.commit_feature.outputs.short_sha }}.apk"

      - name: Publish single test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payment-method-${{ steps.commit_feature.outputs.sha }}
          target_commitish: ${{ steps.commit_feature.outputs.sha }}
          name: Steuer-Assistent Zahlungsart
          body: |
            Testversion mit Zahlungsart-Erkennung für neue und bestehende Belege.
            Enthält die sichere Room-Migration 14 auf 15.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Zahlungsart-*.apk
          fail_on_unmatched_files: true
