                  save,
                  count=1
              )
              if n != 1: raise SystemExit('Receipt constructor payment insertion failed')
              s = s[:save_start] + save + s[save_end:]
          write(path, s)

          # ---------- 5. UI scan/edit + backfill action ----------
          path = 'app/src/main/java/com/example/ui/ReceiptAppUi.kt'
          s = Path(path).read_text(encoding='utf-8')

          # Scan state
          scan_start = s.find('// Form Fields for Manual review / Edit after extraction')
          if scan_start < 0: raise SystemExit('Scan form section not found')
          if 'var editZahlungsart by remember { mutableStateOf("Unbekannt") }' not in s[scan_start:scan_start+5000]:
              pos = s.find('    var editMieter by remember { mutableStateOf("") }', scan_start)
              if pos < 0: raise SystemExit('Scan editMieter state not found')
              line_end = s.find('\n', pos) + 1
              s = s[:line_end] + '    var editZahlungsart by remember { mutableStateOf("Unbekannt") }\n' + s[line_end:]

          # AI result into scan form
