              call = call.replace(anchor, anchor + '                            zahlungsart = editZahlungsart,\n                            zahlungsartQuelle = "NUTZER_BESTAETIGT",\n                            zahlungsartConfidence = if (editZahlungsart == "Unbekannt") 0.0 else 1.0,\n', 1)
              s = s[:save_call] + call + s[save_call_end:]

