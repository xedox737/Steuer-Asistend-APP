name: Mieteingänge Dashboard Link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_add_rent_dashboard_link.py"
      - ".github/workflows/add-rent-dashboard-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Add dashboard link
        run: python3 .github/workflows/_add_rent_dashboard_link.py
      - name: Verify
        run: |
          git diff --check
          grep -q 'title = "Mieteingänge", subtitle = "Soll/Ist & Nebenkosten"' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q 'AppScreen.RENT_OVERVIEW' app/src/main/java/com/example/ui/ReceiptAppUi.kt
      - name: Compile
        run: gradle compileDebugKotlin --stacktrace --no-daemon
      - name: Test
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified fix
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git rm -f .github/workflows/_add_rent_dashboard_link.py .github/workflows/add-rent-dashboard-link.yml
          git commit -m "Fix: Mieteingänge im Schnellzugriff erreichbar machen [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Mieteingang-Link-${{ steps.commit.outputs.short }}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rent-dashboard-link-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Mieteingänge Link
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Mieteingang-Link-*.apk
