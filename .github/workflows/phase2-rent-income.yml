name: Phase 2 Mieteinnahmen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_phase2_rent_income.py"
      - ".github/workflows/phase2-rent-income.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply rent income feature
        run: python3 .github/workflows/_phase2_rent_income.py

      - name: Verify markers
        shell: bash
        run: |
          git diff --check
          grep -q 'fun RentIncomeOverviewScreen' app/src/main/java/com/example/ui/RentIncomeFeature.kt
          grep -q 'Nebenkostenvorauszahlung / Monat' app/src/main/java/com/example/ui/RentIncomeFeature.kt
          grep -q 'Ist-Einnahmen laut Belegen' app/src/main/java/com/example/ui/RentIncomeFeature.kt
          grep -q 'RentIncomeOverviewScreen(viewModel)' app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Compile Kotlin
        timeout-minutes: 10
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt app/src/main/java/com/example/ui/RentIncomeFeature.kt
          git rm -f .github/workflows/_phase2_rent_income.py .github/workflows/phase2-rent-income.yml
          git commit -m "Feature: Mieteinnahmen und Nebenkosten je Wohneinheit [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Mieteinnahmen-${{ steps.commit.outputs.short }}.apk"

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase2-rent-income-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Mieteinnahmen
          body: |
            Phase 2 Mieteinnahmen:
            - Kaltmiete, Nebenkostenvorauszahlung und sonstige Mietbestandteile je Wohneinheit
            - Ist-Einnahmen aus tatsächlich erfassten Belegen
            - Jahres-Sollhochrechnung und Rückstand je Einheit
            - Kautionen werden nicht als Mieteinnahmen gezählt
            - nicht zugeordnete Miet-/Betriebskosteneinnahmen werden sichtbar markiert
            - Steuerjahr vor/zurück auswählbar
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Mieteinnahmen-*.apk
