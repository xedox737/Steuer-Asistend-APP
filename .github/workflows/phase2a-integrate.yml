name: Phase 2A guarded integration
on:
  push:
    branches: ["agent/bank-phase2a-learning-rules"]
    paths: [".github/workflows/phase2a-integrate.yml"]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2a-learning-rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Apply guarded patch
        run: |
          python3 .github/scripts/phase2a_apply.py
          python3 .github/scripts/phase2a_fix_restore.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt')
          s=p.read_text()
          old='assertEquals(7, payload.getInt("schemaVersion"))'
          if old not in s:
              raise SystemExit('legacy schema assertion anchor missing')
          p.write_text(s.replace(old, 'assertEquals(8, payload.getInt("schemaVersion"))', 1))
          PY
      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - name: Focused backup acceptance
        run: |
          set +e
          gradle testDebugUnitTest --tests 'com.example.data.BankLearningRulesBackupAcceptanceTest' --stacktrace --no-daemon
          code=$?
          if [ $code -ne 0 ]; then
            echo '--- TEST XML ---'
            cat app/build/test-results/testDebugUnitTest/TEST-com.example.data.BankLearningRulesBackupAcceptanceTest.xml || true
            exit $code
          fi
      - name: Verify
        run: |
          gradle lintDebug --stacktrace --no-daemon
          gradle testDebugUnitTest --stacktrace --no-daemon
          gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified product patch
        run: |
          rm .github/scripts/phase2a_apply.py .github/scripts/phase2a_fix_restore.py .github/workflows/phase2a-integrate.yml
          rm -f debug.keystore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Bank Phase 2A learning rules"
          git push origin HEAD:agent/bank-phase2a-learning-rules
