name: Phase 2A guarded integration
on:
  push:
    branches: ["agent/bank-phase2a-learning-rules"]
    paths: [".github/workflows/phase2a-integrate.yml"]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2a-learning-rules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Apply guarded patch
        run: python3 .github/scripts/phase2a_apply.py
      - name: Verify
        run: |
          gradle lintDebug --stacktrace --no-daemon
          gradle testDebugUnitTest --stacktrace --no-daemon
          gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified product patch
        run: |
          rm .github/scripts/phase2a_apply.py .github/workflows/phase2a-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Bank Phase 2A learning rules core"
          git push origin HEAD:agent/bank-phase2a-learning-rules
