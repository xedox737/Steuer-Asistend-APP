name: Phase 3 Jahresassistent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-annual-tax-assistant.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Add Anlage-V annual assistant
        shell: bash
        run: |
          cat > app/src/main/java/com/example/ui/AnnualTaxAssistantFeature.kt <<'KOTLIN'
          package com.example.ui

          import android.content.Context
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.heightIn
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Card
          import androidx.compose.material3.CardDefaults
          import androidx.compose.material3.HorizontalDivider
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.example.data.AppDatabase
          import com.example.data.Loan
          import com.example.data.PropertyMetadata
          import com.example.data.Receipt
          import com.example.data.TaxPropertyCalculator
          import java.time.LocalDate
          import kotlin.math.abs

          private data class TaxBucket(
              val title: String,
              val amount: Double,
              val receipts: List<Receipt> = emptyList(),
              val note: String = "",
              val warning: Boolean = false
          )

          private data class AnnualTaxSummary(
              val year: Int,
              val rentalIncome: Double,
              val otherRentalIncome: Double,
              val debtInterest: Double,
              val afa: Double,
              val renovation: Double,
              val otherFinancing: Double,
              val otherExpenses: Double,
              val totalIncome: Double,
              val totalExpenses: Double,
              val result: Double,
              val incomeBuckets: List<TaxBucket>,
              val expenseBuckets: List<TaxBucket>,
              val warnings: List<String>,
              val redCount: Int,
              val yellowCount: Int
          )

          private fun Receipt.yearOrNull(): Int? = datum.take(4).toIntOrNull()

          private fun isDeposit(receipt: Receipt): Boolean {
              val sub = receipt.unterkategorie.lowercase()
              return sub.contains("kaution")
          }

          private fun isRentalIncome(receipt: Receipt): Boolean {
              if (isDeposit(receipt)) return false
              if (receipt.hauptkategorie == "Miete, Nebenkosten & Kaution") return true
              if (receipt.hauptkategorie == "Sonstige Einnahmen") {
                  val text = (receipt.unterkategorie + " " + receipt.beschreibung).lowercase()
                  return text.contains("miete") || text.contains("betriebskosten") || text.contains("nebenkosten")
              }
              return false
          }

          private fun isPrincipalOrLoanFlow(receipt: Receipt): Boolean {
              val text = (receipt.unterkategorie + " " + receipt.beschreibung).lowercase()
              return text.contains("tilgung") || text.contains("kreditrate") ||
                  text.contains("darlehensrate") || text.contains("kreditauszahlung") ||
                  text.contains("sondertilgung")
          }

          private fun isInterest(receipt: Receipt): Boolean =
              receipt.hauptkategorie == "Finanzierung, Kredite & Versicherungen" &&
                  (receipt.unterkategorie.equals("Kreditzinsen", true) ||
                      receipt.beschreibung.contains("sollzins", true) ||
                      receipt.beschreibung.contains("schuldzins", true))

          private fun afaForYear(metadata: PropertyMetadata, allReceipts: List<Receipt>, year: Int): Double {
              val phase1 = TaxPropertyCalculator.calculate(metadata, allReceipts)
              val startYear = phase1.afaStartDate.take(4).toIntOrNull() ?: return 0.0
              return when {
                  year < startYear -> 0.0
                  year == startYear -> phase1.firstYearAfa
                  else -> phase1.annualAfa
              }
          }

          private fun buildAnnualTaxSummary(
              context: Context,
              year: Int,
              allReceipts: List<Receipt>,
              metadata: PropertyMetadata,
              loans: List<Loan>
          ): AnnualTaxSummary {
              val receipts = allReceipts.filter { it.yearOrNull() == year }
              val phase1 = TaxPropertyCalculator.calculate(metadata, allReceipts)
              val rentalReceipts = receipts.filter(::isRentalIncome)
              val regularRental = rentalReceipts.filter { it.hauptkategorie == "Miete, Nebenkosten & Kaution" }
              val otherRental = rentalReceipts.filter { it.hauptkategorie == "Sonstige Einnahmen" }
              val rentalIncome = regularRental.sumOf { it.bruttobetrag }
              val otherRentalIncome = otherRental.sumOf { it.bruttobetrag }

              val assignmentPrefs = context.getSharedPreferences("loan_interest_assignments", Context.MODE_PRIVATE)
              val loansById = loans.associateBy { it.id }
              val interestReceipts = receipts.filter(::isInterest)
              val assignedInterest = interestReceipts.mapNotNull { receipt ->
                  val loanId = assignmentPrefs.getInt("receipt_${receipt.id}", 0)
                  val loan = loansById[loanId] ?: return@mapNotNull null
                  receipt to loan
              }
              val debtInterest = assignedInterest.sumOf { (receipt, loan) ->
                  receipt.bruttobetrag * (loan.vermietungsanteilProzent.coerceIn(0.0, 100.0) / 100.0)
              }

              val afa = afaForYear(metadata, allReceipts, year)
              val renovationReceipts = receipts.filter { it.hauptkategorie == "Renovierungs- / Reparaturkosten & Investitionen" }
              val renovationGross = renovationReceipts.sumOf { it.bruttobetrag }
              val yearInsideMonitor = phase1.monitorStartDate.take(4).toIntOrNull()?.let { start ->
                  phase1.monitorEndDate.take(4).toIntOrNull()?.let { end -> year in start..end }
              } ?: false
              val renovationBlocked = phase1.is15PercentExceeded && yearInsideMonitor
              val renovationDeductible = if (renovationBlocked) 0.0 else renovationGross

              val otherFinancingReceipts = receipts.filter {
                  it.hauptkategorie == "Finanzierung, Kredite & Versicherungen" &&
                      !isInterest(it) && !isPrincipalOrLoanFlow(it)
              }
              val otherFinancing = otherFinancingReceipts.sumOf { it.bruttobetrag }

              val genericExpenseReceipts = receipts.filter { receipt ->
                  !isRentalIncome(receipt) &&
                      receipt.hauptkategorie !in setOf(
                          "Anschaffungskosten",
                          "Finanzierung, Kredite & Versicherungen",
                          "Renovierungs- / Reparaturkosten & Investitionen"
                      )
              }
              val otherExpenses = genericExpenseReceipts.sumOf { it.bruttobetrag }

              val totalIncome = rentalIncome + otherRentalIncome
              val totalExpenses = debtInterest + afa + renovationDeductible + otherFinancing + otherExpenses
              val result = totalIncome - totalExpenses

              val warnings = mutableListOf<String>()
              var red = 0
              var yellow = 0

              val unassignedInterest = interestReceipts.count { assignmentPrefs.getInt("receipt_${it.id}", 0) <= 0 }
              if (unassignedInterest > 0) {
                  warnings += "$unassignedInterest Schuldzins-Beleg${if (unassignedInterest == 1) " ist" else "e sind"} keinem Darlehen zugeordnet."
                  red++
              }
              val rentWithoutUnit = rentalReceipts.count { it.wohneinheit.isBlank() || it.wohneinheit == "Gesamtobjekt / Allgemein" }
              if (rentWithoutUnit > 0) {
                  warnings += "$rentWithoutUnit Miet-/Nebenkostenbeleg${if (rentWithoutUnit == 1) " ist" else "e sind"} keiner konkreten Wohneinheit zugeordnet."
                  yellow++
              }
              val openReceipts = receipts.count { it.freigabestatus != "FREIGEGEBEN" }
              if (openReceipts > 0) {
                  warnings += "$openReceipts Beleg${if (openReceipts == 1) " ist" else "e sind"} noch nicht steuerlich freigegeben."
                  yellow++
              }
              if (phase1.allocationNeedsReview) {
                  warnings += "Kaufpreisaufteilung Gebäude/Grund und Boden weicht um ${NumberFormatter.format(abs(phase1.allocationDifference))} ab."
                  red++
              }
              if (phase1.is15PercentExceeded) {
                  warnings += "15-%-Grenze überschritten: betroffene Sanierungskosten werden im Jahresassistenten nicht automatisch als Sofortaufwand angesetzt."
                  red++
              } else if (phase1.limitUsagePercent >= 80.0) {
                  warnings += "15-%-Monitor liegt bereits bei ${"%.1f".format(phase1.limitUsagePercent)} %."
                  yellow++
              }
              if (phase1.estimatedNetCount > 0) {
                  warnings += "Bei ${phase1.estimatedNetCount} Beleg${if (phase1.estimatedNetCount == 1) "" else "en"} im 15-%-Monitor ist der Nettobetrag nur geschätzt."
                  yellow++
              }
              val duplicateIds = receipts.filter { it.internalId.isNotBlank() }.groupBy { it.internalId }.count { it.value.size > 1 }
              if (duplicateIds > 0) {
                  warnings += "$duplicateIds doppelte stabile Beleg-ID${if (duplicateIds == 1) " wurde" else "s wurden"} erkannt."
                  red++
              }

              val incomeBuckets = listOf(
                  TaxBucket("Mieten & Nebenkosten", rentalIncome, regularRental, "Kautionen ausgeschlossen"),
                  TaxBucket("Sonstige vermietungsbezogene Einnahmen", otherRentalIncome, otherRental)
              ).filter { it.amount != 0.0 || it.receipts.isNotEmpty() }

              val expenseBuckets = listOf(
                  TaxBucket("Schuldzinsen", debtInterest, assignedInterest.map { it.first }, "Nur zugeordnete Zinsbelege × Vermietungsanteil"),
                  TaxBucket("AfA Gebäude", afa, note = "Aus Objekt-Stammdaten und AfA-Bemessungsgrundlage"),
                  TaxBucket(
                      "Erhaltungsaufwand / Reparaturen",
                      renovationDeductible,
                      renovationReceipts,
                      if (renovationBlocked) "Nicht automatisch angesetzt wegen überschrittener 15-%-Grenze" else "Vorläufiger Sofortaufwand; steuerlich prüfen",
                      renovationBlocked
                  ),
                  TaxBucket("Weitere Finanzierungskosten", otherFinancing, otherFinancingReceipts, "Tilgung, Kreditrate und Darlehensauszahlung ausgeschlossen"),
                  TaxBucket("Sonstige Werbungskosten", otherExpenses, genericExpenseReceipts)
              ).filter { it.amount != 0.0 || it.receipts.isNotEmpty() || it.title == "AfA Gebäude" }

              return AnnualTaxSummary(
                  year, rentalIncome, otherRentalIncome, debtInterest, afa, renovationDeductible,
                  otherFinancing, otherExpenses, totalIncome, totalExpenses, result,
                  incomeBuckets, expenseBuckets, warnings, red, yellow
              )
          }

          @Composable
          fun AnnualTaxAssistantScreen(viewModel: ReceiptViewModel) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val database = remember(context) { AppDatabase.getDatabase(context.applicationContext, scope) }
              val receipts by viewModel.receipts.collectAsState()
              val propertyState by viewModel.propertyMetadata.collectAsState()
              val loans by database.loanDao().getAllLoansFlow().collectAsState(initial = emptyList())
              val metadata = propertyState ?: PropertyMetadata()
              val availableYears = remember(receipts) {
                  receipts.mapNotNull { it.yearOrNull() }.distinct().sortedDescending()
              }
              var year by remember(availableYears) {
                  mutableIntStateOf(availableYears.firstOrNull() ?: LocalDate.now().year)
              }
              var details by remember { mutableStateOf<TaxBucket?>(null) }
              val summary = remember(context, year, receipts, metadata, loans) {
                  buildAnnualTaxSummary(context, year, receipts, metadata, loans)
              }

              LazyColumn(
                  modifier = Modifier.fillMaxSize().testTag("anlage_v_annual_assistant"),
                  contentPadding = androidx.compose.foundation.layout.PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(3.dp)) {
                          Text("Anlage-V-Jahresassistent", fontSize = 21.sp, fontWeight = FontWeight.Black, color = DarkNavy)
                          Text("Automatische Jahresübersicht aus Belegen, Objekt, AfA und Darlehen", fontSize = 11.sp, color = SlateGray)
                      }
                  }
                  item {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          OutlinedButton(onClick = { year-- }) { Text("‹") }
                          Text("Steuerjahr $year", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                          OutlinedButton(onClick = { year++ }) { Text("›") }
                      }
                  }
                  item {
                      val statusText = when {
                          summary.redCount > 0 -> "ROT · ${summary.redCount} kritische Punkte"
                          summary.yellowCount > 0 -> "GELB · ${summary.yellowCount} Prüfpunkte"
                          else -> "GRÜN · keine offenen Prüfhinweise"
                      }
                      val statusColor = when {
                          summary.redCount > 0 -> CrimsonRed
                          summary.yellowCount > 0 -> WarmOrange
                          else -> EmeraldGreen
                      }
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = androidx.compose.ui.graphics.Color.White),
                          border = BorderStroke(1.dp, statusColor.copy(alpha = 0.5f)),
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Prüfstatus", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                              Text(statusText, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = statusColor)
                              if (summary.warnings.isEmpty()) {
                                  Text("Die automatisch prüfbaren Daten sind derzeit plausibel.", fontSize = 10.sp, color = SlateGray)
                              } else {
                                  summary.warnings.forEach { warning -> Text("• $warning", fontSize = 10.sp, color = SlateGray) }
                              }
                          }
                      }
                  }
                  item { Text("Einnahmen", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = DarkNavy) }
                  items(summary.incomeBuckets, key = { "income_${it.title}" }) { bucket ->
                      AnnualTaxBucketCard(bucket) { details = bucket }
                  }
                  item { Text("Werbungskosten", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = DarkNavy) }
                  items(summary.expenseBuckets, key = { "expense_${it.title}" }) { bucket ->
                      AnnualTaxBucketCard(bucket) { details = bucket }
                  }
                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = androidx.compose.ui.graphics.Color.White),
                          border = BorderStroke(1.dp, BorderColor),
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          Column(modifier = Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text("Vorläufiges Jahresergebnis", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                              AnnualTaxAmountRow("Einnahmen gesamt", summary.totalIncome, EmeraldGreen)
                              AnnualTaxAmountRow("Werbungskosten gesamt", summary.totalExpenses, CrimsonRed)
                              HorizontalDivider(color = BorderColor)
                              AnnualTaxAmountRow(
                                  if (summary.result >= 0) "Überschuss" else "Verlust",
                                  abs(summary.result),
                                  if (summary.result >= 0) EmeraldGreen else CrimsonRed
                              )
                              Text("Vorbereitungshilfe, keine Steuerberatung. Prüfpunkte müssen vor Übernahme in ELSTER/DATEV geklärt werden.", fontSize = 9.sp, color = SlateGray)
                          }
                      }
                  }
              }

              details?.let { bucket ->
                  AlertDialog(
                      onDismissRequest = { details = null },
                      title = { Text(bucket.title, fontWeight = FontWeight.Bold) },
                      text = {
                          LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 480.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              item { Text("Summe: ${NumberFormatter.format(bucket.amount)}", fontWeight = FontWeight.Bold, color = DarkNavy) }
                              if (bucket.note.isNotBlank()) item { Text(bucket.note, fontSize = 10.sp, color = if (bucket.warning) CrimsonRed else SlateGray) }
                              if (bucket.receipts.isEmpty()) {
                                  item { Text("Kein einzelner Beleg – Wert wird aus Stammdaten/Berechnung übernommen.", fontSize = 10.sp, color = SlateGray) }
                              } else {
                                  items(bucket.receipts, key = { "detail_${it.id}" }) { receipt ->
                                      Card(colors = CardDefaults.cardColors(containerColor = SoftBackground), border = BorderStroke(1.dp, BorderColor)) {
                                          Column(modifier = Modifier.padding(10.dp)) {
                                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                  Text(receipt.getEffectiveDisplayId(), fontSize = 9.sp, color = SlateGray)
                                                  Text(NumberFormatter.format(receipt.bruttobetrag), fontSize = 11.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                                              }
                                              Text(receipt.aussteller, fontSize = 11.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                                              Text("${receipt.datum} · ${receipt.unterkategorie}", fontSize = 9.sp, color = SlateGray)
                                              if (receipt.wohneinheit.isNotBlank()) Text(receipt.wohneinheit, fontSize = 9.sp, color = SlateGray)
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = { TextButton(onClick = { details = null }) { Text("Schließen") } }
                  )
              }
          }

          @Composable
          private fun AnnualTaxBucketCard(bucket: TaxBucket, onClick: () -> Unit) {
              Card(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick),
                  colors = CardDefaults.cardColors(containerColor = androidx.compose.ui.graphics.Color.White),
                  border = BorderStroke(1.dp, if (bucket.warning) CrimsonRed.copy(alpha = 0.5f) else BorderColor),
                  shape = RoundedCornerShape(12.dp)
              ) {
                  Row(modifier = Modifier.fillMaxWidth().padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {
                          Text(bucket.title, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = DarkNavy)
                          if (bucket.note.isNotBlank()) Text(bucket.note, fontSize = 9.sp, color = if (bucket.warning) CrimsonRed else SlateGray)
                          if (bucket.receipts.isNotEmpty()) Text("${bucket.receipts.size} Beleg${if (bucket.receipts.size == 1) "" else "e"} · Details öffnen", fontSize = 9.sp, color = AccentBlue)
                      }
                      Text(NumberFormatter.format(bucket.amount), fontSize = 12.sp, fontWeight = FontWeight.Bold, color = if (bucket.warning) CrimsonRed else DarkNavy)
                  }
              }
          }

          @Composable
          private fun AnnualTaxAmountRow(label: String, amount: Double, color: androidx.compose.ui.graphics.Color) {
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(label, fontSize = 11.sp, color = SlateGray)
                  Text(NumberFormatter.format(amount), fontSize = 12.sp, fontWeight = FontWeight.Bold, color = color)
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          old = '''@Composable
          fun TaxCalculatorScreen(viewModel: ReceiptViewModel) {
              val report by viewModel.taxReport.collectAsState()
              
              Column(modifier = Modifier.padding(16.dp)) {
                  Text("Steuer-Schätzung (Anlage V)", style = MaterialTheme.typography.titleLarge, color = DarkNavy)
                  Spacer(modifier = Modifier.height(16.dp))
                  
                  Card(modifier = Modifier.fillMaxWidth()) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Einnahmen: ${"%.2f".format(report.income)} EUR")
                          Text("Ausgaben: ${"%.2f".format(report.expenses)} EUR")
                          HorizontalDivider(modifier = Modifier.padding(vertical = 8.dp))
                          Text("Zu versteuernder Gewinn: ${"%.2f".format(report.profit)} EUR")
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("Geschätzte Steuerlast (30%): ${"%.2f".format(report.estimatedTax)} EUR", fontWeight = FontWeight.Bold)
                      }
                  }
                  Text("Hinweis: Dies ist eine grobe Schätzung und keine steuerliche Beratung.", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(top = 8.dp))
              }
          }'''
          new = '''@Composable
          fun TaxCalculatorScreen(viewModel: ReceiptViewModel) {
              AnnualTaxAssistantScreen(viewModel)
          }'''
          if old not in s:
              raise SystemExit('TaxCalculatorScreen anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify feature markers
        run: |
          git diff --check
          grep -q 'Anlage-V-Jahresassistent' app/src/main/java/com/example/ui/AnnualTaxAssistantFeature.kt
          grep -q 'AnnualTaxAssistantScreen(viewModel)' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q '15-%-Grenze überschritten' app/src/main/java/com/example/ui/AnnualTaxAssistantFeature.kt
          grep -q 'Kautionen ausgeschlossen' app/src/main/java/com/example/ui/AnnualTaxAssistantFeature.kt

      - name: Compile Kotlin
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified Phase 3 core
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/AnnualTaxAssistantFeature.kt app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git rm -f .github/workflows/phase3-annual-tax-assistant.yml
          git commit -m "Feature: Phase 3 Anlage-V-Jahresassistent [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Phase3-${{ steps.commit.outputs.short }}.apk"

      - name: Publish verified APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase3-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Phase 3 – Jahresassistent
          body: |
            - Anlage-V-Jahresassistent mit Steuerjahreswahl
            - Mieten/Nebenkosten ohne Kautionen
            - zugeordnete Schuldzinsen mit Vermietungsanteil
            - AfA je Steuerjahr
            - Werbungskosten-Gruppen mit Belegdetails
            - 15%-Monitor als Sicherheitsprüfung
            - Rot/Gelb/Grün-Prüfstatus und vorläufiges Jahresergebnis
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Phase3-*.apk
