name: Fix CAMT V8 compile

on:
  push:
    branches:
      - agent/camt052-053-v8-zip-import
    paths:
      - .github/scripts/fix_camt_v8_compile.py
      - .github/workflows/fix-camt-v8-compile.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[camt-v8-compile-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/camt052-053-v8-zip-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_camt_v8_compile.py
      - name: Commit compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/BankImportV8.kt app/src/main/java/com/example/ui/ReceiptViewModel.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix CAMT V8 compile compatibility [camt-v8-compile-fixed]"
          git push origin HEAD:agent/camt052-053-v8-zip-import
