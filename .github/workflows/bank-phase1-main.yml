name: Bank reconciliation phase 1 verified integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bank-phase1-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch prepared staging sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bank-phase1-staging
          mkdir -p app/src/main/java/com/example/data app/src/main/java/com/example/ui app/src/test/java/com/example/data docs
          git show origin/bank-phase1-staging:app/src/main/java/com/example/data/BankingModels.kt > app/src/main/java/com/example/data/BankingModels.kt
          git show origin/bank-phase1-staging:app/src/main/java/com/example/ui/BankFeature.kt > app/src/main/java/com/example/ui/BankFeature.kt
          git show origin/bank-phase1-staging:app/src/test/java/com/example/data/BankImportAndMatchingTest.kt > app/src/test/java/com/example/data/BankImportAndMatchingTest.kt
          git show origin/bank-phase1-staging:docs/BANK_BELEGABGLEICH_ARCHITECTURE.md > docs/BANK_BELEGABGLEICH_ARCHITECTURE.md
          mkdir -p .github/workflows/bank-phase1-patches
          for f in migration-21-22.txt viewmodel-functions.txt viewmodel-flows.txt backup-helpers.txt; do
            git show "origin/bank-phase1-staging:.github/workflows/bank-phase1-patches/$f" > ".github/workflows/bank-phase1-patches/$f"
          done
          git show origin/bank-phase1-staging:.github/workflows/bank-phase1-integrate.py > .github/workflows/bank-phase1-integrate.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply guarded bank integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/bank-phase1-integrate.py
          git add -N \
            app/src/main/java/com/example/data/BankingModels.kt \
            app/src/main/java/com/example/ui/BankFeature.kt \
            app/src/test/java/com/example/data/BankImportAndMatchingTest.kt \
            docs/BANK_BELEGABGLEICH_ARCHITECTURE.md
          git diff --check
          git diff --stat

      - name: Run lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit only verified product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows/bank-phase1-patches .github/workflows/bank-phase1-integrate.py
          git reset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/BankingModels.kt \
            app/src/main/java/com/example/data/ReceiptDatabase.kt \
            app/src/main/java/com/example/data/SupplementalDriveBackup.kt \
            app/src/main/java/com/example/ui/BankFeature.kt \
            app/src/main/java/com/example/ui/ReceiptViewModel.kt \
            app/src/main/java/com/example/ui/ReceiptAppUi.kt \
            app/src/test/java/com/example/data/BankImportAndMatchingTest.kt \
            app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt \
            docs/BANK_BELEGABGLEICH_ARCHITECTURE.md
          git diff --cached --check
          git commit -m "Add bank transaction and receipt reconciliation"
          git push origin HEAD:main

      - name: Prepare traceable APK
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-bank-phase1-${SHORT_SHA}.apk"
          {
            echo "commit=${FULL_SHA}"
            echo "short_commit=${SHORT_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > bank-phase1-build-info.txt

      - name: Upload verified bank APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-phase1-debug
          path: |
            Steuer-Assistent-bank-phase1-*.apk
            bank-phase1-build-info.txt
          if-no-files-found: error
