name: Repair payment method workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-payment-method-workflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair unstable ViewModel anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/add-payment-method.yml')
          s = p.read_text(encoding='utf-8')

          old = '''          if '_isBackfillingPaymentMethods' not in s:
              anchor = '    private val _bankStatementResetVersion = MutableStateFlow(0)\\n    val bankStatementResetVersion = _bankStatementResetVersion.asStateFlow()\\n'
              insert = anchor + ''' + "'''" + '''

    private val _isBackfillingPaymentMethods = MutableStateFlow(false)
    val isBackfillingPaymentMethods = _isBackfillingPaymentMethods.asStateFlow()
    private val _paymentBackfillStatus = MutableStateFlow<String?>(null)
    val paymentBackfillStatus = _paymentBackfillStatus.asStateFlow()
''' + "'''" + '''
              if anchor not in s: raise SystemExit('ViewModel bank state anchor not found')
              s = s.replace(anchor, insert, 1)
'''

          new = '''          if '_isBackfillingPaymentMethods' not in s:
              anchor = '    // Save extracted receipt to database\\n'
              states = ''' + "'''" + '''    private val _isBackfillingPaymentMethods = MutableStateFlow(false)
    val isBackfillingPaymentMethods = _isBackfillingPaymentMethods.asStateFlow()
    private val _paymentBackfillStatus = MutableStateFlow<String?>(null)
    val paymentBackfillStatus = _paymentBackfillStatus.asStateFlow()

''' + "'''" + '''
              if anchor not in s: raise SystemExit('ViewModel save section anchor not found')
              s = s.replace(anchor, states + anchor, 1)
'''

          if old not in s:
              raise SystemExit('Old unstable payment workflow anchor block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git diff -- .github/workflows/add-payment-method.yml

      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/add-payment-method.yml
          git commit -m "CI: Zahlungsart-Workflow robusten ViewModel-Anker verwenden"
          git push origin HEAD:main
