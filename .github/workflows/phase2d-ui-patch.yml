name: Phase2D UI patch

on:
  push:
    branches:
      - agent/bank-phase2d-combinations-review-queue
    paths:
      - '.github/workflows/phase2d-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2d-combinations-review-queue
      - name: Apply UI patch
        run: python3 .github/scripts/phase2d_integrate_ui.py
      - name: Commit UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt
          if git diff --cached --quiet; then
            echo 'No product changes'
            exit 0
          fi
          git commit -m '[phase2d-ui] Wire review queue and combination workflow'
          git push origin HEAD:agent/bank-phase2d-combinations-review-queue
