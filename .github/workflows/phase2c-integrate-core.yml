name: Phase 2C core integration

on:
  push:
    branches:
      - agent/bank-phase2c-loans-recurring

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2c-loans-recurring
          fetch-depth: 0
      - name: Verify Phase 2C core and backup schema 10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required_files = [
              'app/src/main/java/com/example/data/BankLoanRecurringPersistence.kt',
              'app/src/main/java/com/example/data/SupplementalDriveBackup.kt',
              'app/src/main/java/com/example/ui/ReceiptViewModel.kt'
          ]
          for f in required_files:
              if not Path(f).exists(): raise SystemExit('missing ' + f)
          backup = Path('app/src/main/java/com/example/data/SupplementalDriveBackup.kt').read_text()
          for needle in ['SCHEMA_VERSION = 10', 'bankLoanAssignments', 'bankRecurringPatterns', 'toBankLoanAssignment()', 'toBankRecurringPattern()']:
              if needle not in backup: raise SystemExit('backup integration missing: ' + needle)
          test = Path('app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt')
          s = test.read_text().replace('assertEquals(9, payload.getInt("schemaVersion"))', 'assertEquals(10, payload.getInt("schemaVersion"))')
          test.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name xedox737
          git config user.email sergej-gerweck@web.de
          git add app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt
          git commit -m '[phase2c-backup] Expect supplemental schema 10'
          git push origin HEAD:agent/bank-phase2c-loans-recurring
