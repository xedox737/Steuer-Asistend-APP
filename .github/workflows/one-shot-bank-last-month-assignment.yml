name: One-shot Bank last-month assignment

on:
  workflow_dispatch:
  push:
    branches: [feature/bank-classification-phase-a]
    paths:
      - '.github/workflows/one-shot-bank-last-month-assignment.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bank-classification-phase-a
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Apply last-month UI patch
        run: |
          python3 .github/scripts/apply_bank_last_month_assignment_ui.py
          git diff --check
      - name: Lint
        run: gradle lintDebug --stacktrace --no-daemon
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/BankFeature.kt
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Add safe last-month bank assignment flow"
            git push origin HEAD:feature/bank-classification-phase-a
          fi
