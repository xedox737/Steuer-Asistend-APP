name: One-shot screenshot UI fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-ui-fixes.yml

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply Bank detail reference chrome
        run: |
          python3 .github/scripts/apply_bank_reference_detail_chrome.py
          git diff --check

      - name: Lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/BankFeature.kt app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "Bank & Belege: Detailansicht exakt an Referenzdesign angleichen"
          git push origin HEAD:main
