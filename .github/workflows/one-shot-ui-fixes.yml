name: One-shot screenshot UI fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply screenshot-only layout fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          def replace_all(label: str, old: str, new: str):
              global s
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'{label} anchor count={count}')
              s = s.replace(old, new)
              print(f'{label}: replaced {count} occurrence(s)')

          # 1) DATEV: year/type blocks are stacked vertically so chips keep enough width.
          replace_all(
              'DATEV year layout',
              '''                                Row(
                                    modifier = Modifier.fillMaxWidth(),
                                    horizontalArrangement = Arrangement.spacedBy(8.dp)
                                ) {
                                    Column(modifier = Modifier.weight(1f)) {
                                        Text("Wirtschaftsjahr:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)''',
              '''                                Column(
                                    modifier = Modifier.fillMaxWidth(),
                                    verticalArrangement = Arrangement.spacedBy(8.dp)
                                ) {
                                    Column(modifier = Modifier.fillMaxWidth()) {
                                        Text("Wirtschaftsjahr:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          )

          replace_all(
              'DATEV type layout',
              '''                                    Column(modifier = Modifier.weight(1f)) {
                                        Text("Belegtyp:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)''',
              '''                                    Column(modifier = Modifier.fillMaxWidth()) {
                                        Text("Belegtyp:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          )

          # 2) Bottom navigation: only label layout is changed; navigation behavior stays untouched.
          replace_all(
              'bottom nav label',
              '''                            label = { Text(label, fontSize = 11.sp, fontWeight = FontWeight.SemiBold) },''',
              '''                            label = {
                                Text(
                                    label,
                                    fontSize = if (screen == AppScreen.LOGBOOK) 9.sp else 11.sp,
                                    fontWeight = FontWeight.SemiBold,
                                    maxLines = 1
                                )
                            },'''
          )

          # 3) Fahrtenbuch distance summary: prevent overlap between distance badge and costs.
          replace_all(
              'distance summary left column',
              '''            ) {
                Column {
                    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                        Text(
                            text = "Entfernung:",''',
              '''            ) {
                Column(modifier = Modifier.weight(1f)) {
                    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                        Text(
                            text = "Entfernung:",'''
          )

          replace_all(
              'distance summary costs',
              '''                Column(horizontalAlignment = Alignment.End) {
                    Text(
                        text = "Werbungskosten (0,30 €/km):",''',
              '''                Spacer(modifier = Modifier.width(12.dp))
                Column(
                    horizontalAlignment = Alignment.End,
                    modifier = Modifier.widthIn(min = 118.dp)
                ) {
                    Text(
                        text = "Werbungskosten (0,30 €/km):",'''
          )

          if s == original:
              raise SystemExit('No UI changes applied')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Commit screenshot UI fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "UI: Darstellungsfehler aus Screenshots korrigieren"
          git push origin HEAD:main
