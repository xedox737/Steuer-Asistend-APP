name: One-shot screenshot UI fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-ui-fixes.yml"

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply Belege and screenshot-only UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          def replace_all(label: str, old: str, new: str):
              global s
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'{label} anchor count={count}')
              s = s.replace(old, new)
              print(f'{label}: replaced {count} occurrence(s)')

          replace_all(
              'Belege screen function name',
              'AppScreen.RECEIPTS_LIST -> ReceiptListScreen(viewModel)',
              'AppScreen.RECEIPTS_LIST -> ReceiptsListScreen(viewModel)'
          )

          replace_all(
              'DATEV year layout',
              '''                                Row(
                                    modifier = Modifier.fillMaxWidth(),
                                    horizontalArrangement = Arrangement.spacedBy(8.dp)
                                ) {
                                    Column(modifier = Modifier.weight(1f)) {
                                        Text("Wirtschaftsjahr:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)''',
              '''                                Column(
                                    modifier = Modifier.fillMaxWidth(),
                                    verticalArrangement = Arrangement.spacedBy(8.dp)
                                ) {
                                    Column(modifier = Modifier.fillMaxWidth()) {
                                        Text("Wirtschaftsjahr:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          )

          replace_all(
              'DATEV type layout',
              '''                                    Column(modifier = Modifier.weight(1f)) {
                                        Text("Belegtyp:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)''',
              '''                                    Column(modifier = Modifier.fillMaxWidth()) {
                                        Text("Belegtyp:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'''
          )

          replace_all(
              'bottom nav label',
              '''                            label = { Text(label, fontSize = 11.sp, fontWeight = FontWeight.SemiBold) },''',
              '''                            label = {
                                Text(
                                    label,
                                    fontSize = if (screen == AppScreen.LOGBOOK) 9.sp else 11.sp,
                                    fontWeight = FontWeight.SemiBold,
                                    maxLines = 1
                                )
                            },'''
          )

          replace_all(
              'distance summary left column',
              '''            ) {
                Column {
                    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                        Text(
                            text = "Entfernung:",''',
              '''            ) {
                Column(modifier = Modifier.weight(1f)) {
                    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                        Text(
                            text = "Entfernung:",'''
          )

          replace_all(
              'distance summary costs',
              '''                Column(horizontalAlignment = Alignment.End) {
                    Text(
                        text = "Werbungskosten (0,30 €/km):",''',
              '''                Spacer(modifier = Modifier.width(12.dp))
                Column(
                    horizontalAlignment = Alignment.End,
                    modifier = Modifier.widthIn(min = 118.dp)
                ) {
                    Text(
                        text = "Werbungskosten (0,30 €/km):",'''
          )

          if s == original:
              raise SystemExit('No source changes applied')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "Fix: Belege-Seite und mobile Darstellung korrigieren"
          git push origin HEAD:main

      - name: Prepare traceable APK
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-debug-${SHORT_SHA}.apk"
          {
            echo "commit=${FULL_SHA}"
            echo "short_commit=${SHORT_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-verified
          path: Steuer-Assistent-debug-*.apk
          if-no-files-found: error

      - name: Publish verified test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_id }}
          name: Steuer-Assistent korrigierte Testversion
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true
