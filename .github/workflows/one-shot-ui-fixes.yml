name: One-shot screenshot UI fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-ui-fixes.yml"

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply Belege and screenshot-only UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          def replace_exact_once(label: str, old: str, new: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} count={count}, expected=1')
              s = s.replace(old, new, 1)
              print(f'{label}: ok')

          def replace_at(label: str, start: int, old: str, new: str):
              global s
              if start < 0 or s[start:start + len(old)] != old:
                  raise SystemExit(f'{label}: anchor mismatch')
              s = s[:start] + new + s[start + len(old):]
              print(f'{label}: ok')

          # 1) Belege-Seite: only restore the already existing composable name.
          replace_exact_once(
              'Belege screen function name',
              'AppScreen.RECEIPTS_LIST -> ReceiptListScreen(viewModel)',
              'AppScreen.RECEIPTS_LIST -> ReceiptsListScreen(viewModel)'
          )

          # 2) DATEV mobile layout. Locate the exact filter section by its visible labels,
          #    then change only Row/Column layout primitives; filter logic remains untouched.
          year_label = 'Text("Wirtschaftsjahr:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          year_idx = s.find(year_label)
          if year_idx < 0:
              raise SystemExit('DATEV year label missing')

          year_inner_old = 'Column(modifier = Modifier.weight(1f)) {'
          year_inner_idx = s.rfind(year_inner_old, 0, year_idx)
          if year_inner_idx < 0 or year_idx - year_inner_idx > 220:
              raise SystemExit('DATEV year inner column not found nearby')
          replace_at('DATEV year inner column', year_inner_idx, year_inner_old, 'Column(modifier = Modifier.fillMaxWidth()) {')

          # Recalculate label position after replacement.
          year_idx = s.find(year_label)
          outer_row_idx = s.rfind('Row(', 0, year_inner_idx)
          if outer_row_idx < 0 or year_inner_idx - outer_row_idx > 220:
              raise SystemExit('DATEV outer row not found nearby')
          replace_at('DATEV outer Row to Column', outer_row_idx, 'Row(', 'Column(')

          arrangement_old = 'horizontalArrangement = Arrangement.spacedBy(8.dp)'
          arrangement_idx = s.find(arrangement_old, outer_row_idx, year_inner_idx + 120)
          if arrangement_idx < 0:
              raise SystemExit('DATEV outer arrangement not found')
          replace_at('DATEV outer arrangement', arrangement_idx, arrangement_old, 'verticalArrangement = Arrangement.spacedBy(8.dp)')

          type_label = 'Text("Belegtyp:", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)'
          type_idx = s.find(type_label, year_idx)
          if type_idx < 0:
              raise SystemExit('DATEV type label missing')
          type_inner_old = 'Column(modifier = Modifier.weight(1f)) {'
          type_inner_idx = s.rfind(type_inner_old, 0, type_idx)
          if type_inner_idx < 0 or type_idx - type_inner_idx > 220:
              raise SystemExit('DATEV type inner column not found nearby')
          replace_at('DATEV type inner column', type_inner_idx, type_inner_old, 'Column(modifier = Modifier.fillMaxWidth()) {')

          # 3) Bottom navigation: keep Fahrtenbuch on one line, behavior unchanged.
          replace_exact_once(
              'bottom nav label',
              'label = { Text(label, fontSize = 11.sp, fontWeight = FontWeight.SemiBold) },',
              '''label = {
                                Text(
                                    label,
                                    fontSize = if (screen == AppScreen.LOGBOOK) 9.sp else 11.sp,
                                    fontWeight = FontWeight.SemiBold,
                                    maxLines = 1
                                )
                            },'''
          )

          # 4) Fahrtenbuch summary: give left area flexible space and reserve room for costs.
          distance_label = 'text = "Entfernung:"'
          distance_idx = s.find(distance_label)
          if distance_idx < 0:
              raise SystemExit('distance label missing')
          left_old = 'Column {'
          left_idx = s.rfind(left_old, 0, distance_idx)
          if left_idx < 0 or distance_idx - left_idx > 300:
              raise SystemExit('distance left column not found nearby')
          replace_at('distance left column', left_idx, left_old, 'Column(modifier = Modifier.weight(1f)) {')

          costs_label = 'text = "Werbungskosten (0,30 €/km):"'
          costs_idx = s.find(costs_label, distance_idx)
          if costs_idx < 0:
              raise SystemExit('costs label missing')
          costs_old = 'Column(horizontalAlignment = Alignment.End) {'
          costs_idx_col = s.rfind(costs_old, 0, costs_idx)
          if costs_idx_col < 0 or costs_idx - costs_idx_col > 260:
              raise SystemExit('costs column not found nearby')
          costs_new = '''Spacer(modifier = Modifier.width(12.dp))
                Column(
                    horizontalAlignment = Alignment.End,
                    modifier = Modifier.widthIn(min = 118.dp)
                ) {'''
          replace_at('distance costs column', costs_idx_col, costs_old, costs_new)

          # Guardrails: only expected visual/navigation-name changes are allowed in this file.
          if s == original:
              raise SystemExit('No source changes applied')
          if 'AppScreen.RECEIPTS_LIST -> ReceiptListScreen(viewModel)' in s:
              raise SystemExit('old Belege function call still present')
          if 'AppScreen.RECEIPTS_LIST -> ReceiptsListScreen(viewModel)' not in s:
              raise SystemExit('correct Belege function call missing')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "Fix: Belege-Seite und mobile Darstellung korrigieren"
          git push origin HEAD:main

      - name: Prepare traceable APK
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-debug-${SHORT_SHA}.apk"
          {
            echo "commit=${FULL_SHA}"
            echo "short_commit=${SHORT_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-verified
          path: Steuer-Assistent-debug-*.apk
          if-no-files-found: error

      - name: Publish verified test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_id }}
          name: Steuer-Assistent korrigierte Testversion
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true
