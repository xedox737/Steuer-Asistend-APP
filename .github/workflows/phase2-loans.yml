name: Phase 2 Mehrfachdarlehen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_phase2_loans_patch.py"
      - ".github/workflows/phase2-loans.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply Phase 2 loan feature
        run: python3 .github/workflows/_phase2_loans_patch.py

      - name: Verify markers
        shell: bash
        run: |
          git diff --check
          grep -q 'data class Loan(' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'interface LoanDao' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'MIGRATION_16_17' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'version = 17' app/src/main/java/com/example/data/ReceiptDatabase.kt
          grep -q 'LoanManagementSection()' app/src/main/java/com/example/ui/ReceiptAppUi.kt
          grep -q 'fun LoanManagementSection()' app/src/main/java/com/example/ui/LoanFeature.kt
          grep -q 'Darlehen hinzufügen' app/src/main/java/com/example/ui/LoanFeature.kt

      - name: Compile Kotlin
        timeout-minutes: 10
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified feature
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/ReceiptDatabase.kt \
                  app/src/main/java/com/example/ui/ReceiptAppUi.kt \
                  app/src/main/java/com/example/ui/LoanFeature.kt
          git rm -f .github/workflows/_phase2_loans_patch.py .github/workflows/phase2-loans.yml
          git commit -m "Feature: Mehrere Darlehen verwalten [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Mehrfachdarlehen-${{ steps.commit.outputs.short }}.apk"

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase2-loans-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Mehrfachdarlehen
          body: |
            Phase 2 Darlehensverwaltung:
            - beliebig viele Darlehen pro Objekt
            - Hinzufügen, Bearbeiten und Löschen
            - Darlehenssumme, Restschuld, Sollzins, Tilgung und Monatsrate
            - Start, Zinsbindung und Laufzeitende
            - Vermietungsanteil für steuerliche Zins-Schätzung
            - lokale Room-Persistenz mit Migration 16 auf 17
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Mehrfachdarlehen-*.apk
