name: One-shot fix receipts navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-receipts-navigation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix receipts screen navigation
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/example/ui/ReceiptAppUi.kt"
          grep -F 'AppScreen.RECEIPTS_LIST -> (viewModel)' "$FILE"
          sed -i 's/AppScreen\.RECEIPTS_LIST -> (viewModel)/AppScreen.RECEIPTS_LIST -> ReceiptListScreen(viewModel)/' "$FILE"
          grep -F 'AppScreen.RECEIPTS_LIST -> ReceiptListScreen(viewModel)' "$FILE"
          ! grep -F 'AppScreen.RECEIPTS_LIST -> (viewModel)' "$FILE"

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git diff --cached --check
          git commit -m "Fix: Belege-Seite wieder anzeigen"
          git push origin HEAD:main
