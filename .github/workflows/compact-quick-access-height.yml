name: Polish receipt accounting dialog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-quick-access-height.yml"

permissions:
  contents: write

jobs:
  polish-accounting-dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply UI-only accounting dialog fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          start = s.find('fun ReceiptDetailDialog(receipt: Receipt, viewModel: ReceiptViewModel, onDismiss: () -> Unit) {')
          end = s.find('@Composable\nfun ReceiptPreviewSection', start)
          if start < 0 or end < 0:
              raise SystemExit('ReceiptDetailDialog section not found')
          section = s[start:end]

          # 1) Compact dialog content height.
          scroll_anchor = '.verticalScroll(scrollState)'
          scroll_idx = section.find(scroll_anchor)
          if scroll_idx < 0:
              raise SystemExit('dialog scroll anchor not found')
          height_expr = '.heightIn(max = if (isEditing) 620.dp else 560.dp)'
          if height_expr not in section[max(0, scroll_idx - 240):scroll_idx]:
              section = section[:scroll_idx] + height_expr + '\n                    ' + section[scroll_idx:]
              print('dialog height cap: applied')
          else:
              print('dialog height cap: already applied')

          # 2) Make the DATEV transformation summary distribute width evenly.
          summary_start = section.find('// Pipeline Summary Badge Bar')
          summary_end = section.find('if (positionenList.isNotEmpty())', summary_start)
          if summary_start < 0 or summary_end < 0:
              raise SystemExit('DATEV summary range not found')
          summary = section[summary_start:summary_end]

          if 'horizontalArrangement = Arrangement.SpaceAround' in summary:
              summary = summary.replace(
                  'horizontalArrangement = Arrangement.SpaceAround',
                  'horizontalArrangement = Arrangement.spacedBy(4.dp)',
                  1
              )

          plain_col = 'Column(horizontalAlignment = Alignment.CenterHorizontally) {'
          weighted_col = 'Column(\n                            modifier = Modifier.weight(1f),\n                            horizontalAlignment = Alignment.CenterHorizontally\n                        ) {'
          col_count = summary.count(plain_col)
          if col_count:
              if col_count != 3:
                  raise SystemExit(f'Unexpected summary column count: {col_count}')
              summary = summary.replace(plain_col, weighted_col)

          arrow_old = 'Text("→", color = SlateGray, fontWeight = FontWeight.Bold)'
          arrow_new = 'Text("→", color = SlateGray, fontWeight = FontWeight.Bold, modifier = Modifier.width(12.dp), textAlign = TextAlign.Center)'
          arrow_count = summary.count(arrow_old)
          if arrow_count:
              if arrow_count != 2:
                  raise SystemExit(f'Unexpected arrow count: {arrow_count}')
              summary = summary.replace(arrow_old, arrow_new)

          labels = [
              ('Text("OCR-Positionen", fontSize = 10.sp, color = SlateGray)',
               'Text("OCR-Positionen", fontSize = 10.sp, lineHeight = 12.sp, color = SlateGray, textAlign = TextAlign.Center, maxLines = 2)'),
              ('Text("Aufteilungen", fontSize = 10.sp, color = SlateGray)',
               'Text("Aufteilungen", fontSize = 10.sp, lineHeight = 12.sp, color = SlateGray, textAlign = TextAlign.Center, maxLines = 2)'),
              ('Text("DATEV-Zeilen", fontSize = 10.sp, color = EmeraldGreen)',
               'Text("DATEV-Zeilen", fontSize = 10.sp, lineHeight = 12.sp, color = EmeraldGreen, textAlign = TextAlign.Center, maxLines = 2)')
          ]
          for old, new in labels:
              if old in summary:
                  summary = summary.replace(old, new, 1)

          required = ['Modifier.weight(1f)', 'DATEV-Zeilen', 'textAlign = TextAlign.Center']
          if not all(x in summary for x in required):
              raise SystemExit('DATEV summary was not transformed as expected')
          section = section[:summary_start] + summary + section[summary_end:]
          print('DATEV summary widths: applied/verified')

          # 3) Stack cost type and cost center vertically.
          cost_row_start = section.find('Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {', section.find('datevRows.forEachIndexed'))
          while cost_row_start >= 0:
              next_chunk = section[cost_row_start:cost_row_start + 700]
              if 'Kostenart: ${row.hauptkategorie}' in next_chunk and 'Kostenstelle: ${row.wohneinheitId.ifBlank' in next_chunk:
                  break
              cost_row_start = section.find('Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {', cost_row_start + 1)
          if cost_row_start < 0:
              if 'verticalArrangement = Arrangement.spacedBy(2.dp)' in section and 'Kostenart: ${row.hauptkategorie}' in section:
                  print('cost type / cost center stacking: already applied')
              else:
                  raise SystemExit('cost type/cost center row not found')
          else:
              first_text = section.find('Text("Kostenart: ${row.hauptkategorie}"', cost_row_start)
              second_text = section.find('Text("Kostenstelle: ${row.wohneinheitId.ifBlank', first_text)
              row_end = section.find('\n                                    }', second_text)
              if first_text < 0 or second_text < 0 or row_end < 0:
                  raise SystemExit('cost type/cost center boundaries not found')
              row_end += len('\n                                    }')
              replacement = '''Column(
                                        modifier = Modifier.fillMaxWidth(),
                                        verticalArrangement = Arrangement.spacedBy(2.dp)
                                    ) {
                                        Text(
                                            "Kostenart: ${row.hauptkategorie}",
                                            fontSize = 10.sp,
                                            lineHeight = 13.sp,
                                            color = SlateGray,
                                            maxLines = 2,
                                            overflow = TextOverflow.Ellipsis
                                        )
                                        Text(
                                            "Kostenstelle: ${row.wohneinheitId.ifBlank { "Gesamt" }}",
                                            fontSize = 10.sp,
                                            lineHeight = 13.sp,
                                            color = SlateGray,
                                            maxLines = 2,
                                            overflow = TextOverflow.Ellipsis
                                        )
                                    }'''
              section = section[:cost_row_start] + replacement + section[row_end:]
              print('cost type / cost center stacking: applied')

          s = s[:start] + section + s[end:]
          if s == original:
              raise SystemExit('No UI changes required')
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified UI-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "UI: Beleg-Kontierung auf kleinen Displays optimieren"
          git push origin HEAD:main
