name: Phase 2C finalize core

on:
  push:
    branches:
      - agent/bank-phase2c-loans-recurring

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bank-phase2c-loans-recurring
          fetch-depth: 0
      - name: Patch confirmed history and backup expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matcher = Path('app/src/main/java/com/example/data/BankPhase1FinalPolicies.kt')
          m = matcher.read_text()
          if 'confirmedLoanTransactionIds: Set<String>' not in m:
              m = m.replace('rules: List<BankLearningRule> = emptyList()\n    ): List<BankLoanSuggestion>', 'rules: List<BankLearningRule> = emptyList(),\n        confirmedLoanTransactionIds: Set<String> = emptySet()\n    ): List<BankLoanSuggestion>', 1)
              m = m.replace('.map { score(transaction, it, account, history, rules) }', '.map { score(transaction, it, account, history, rules, confirmedLoanTransactionIds) }', 1)
              m = m.replace('rules: List<BankLearningRule> = emptyList()\n    ): BankLoanSuggestion', 'rules: List<BankLearningRule> = emptyList(),\n        confirmedLoanTransactionIds: Set<String> = emptySet()\n    ): BankLoanSuggestion', 1)
              marker = '        if (recurrenceEvidence >= 2) {\n            score += 10\n            reasons += "Bestätigbare wiederkehrende Rate (${recurrenceEvidence + 1} Vorkommen)"\n        }\n'
              addition = '        val confirmedHistoryCount = relevantHistory.count { it.transactionId in confirmedLoanTransactionIds }\n        if (confirmedHistoryCount > 0) {\n            val bonus = (confirmedHistoryCount * 4).coerceAtMost(10)\n            score += bonus\n            reasons += "Bestätigte Darlehenshistorie ($confirmedHistoryCount) +$bonus"\n        }\n'
              if marker not in m:
                  raise SystemExit('matcher recurrence marker missing')
              matcher.write_text(m.replace(marker, marker + addition, 1))
          test = Path('app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt')
          t = test.read_text().replace('assertEquals(9, payload.getInt("schemaVersion"))', 'assertEquals(10, payload.getInt("schemaVersion"))')
          test.write_text(t)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name xedox737
          git config user.email sergej-gerweck@web.de
          git add app/src/main/java/com/example/data/BankPhase1FinalPolicies.kt app/src/test/java/com/example/data/SupplementalDriveBackupTest.kt
          git commit -m '[phase2c-finalize] Add confirmed loan history evidence'
          git push origin HEAD:agent/bank-phase2c-loans-recurring
