name: Responsive UI pass

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/responsive-ui-pass.yml"

permissions:
  contents: write

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply responsive UI-only changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          original = s

          def replace_once(label, old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: count={count}, expected=1')
              s = s.replace(old, new, 1)
              print(f'{label}: ok')

          # Foundation: BoxWithConstraints allows components to react to their actual width.
          if 'import androidx.compose.foundation.layout.BoxWithConstraints' not in s:
              replace_once(
                  'BoxWithConstraints import',
                  'import androidx.compose.foundation.layout.Box\n',
                  'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n'
              )

          # Constrain the complete app content on wide devices while retaining full width on phones.
          old_root = '''        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(innerPadding)\n        ) {\n            when (currentScreen) {'''
          new_root = '''        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(innerPadding),\n            contentAlignment = Alignment.TopCenter\n        ) {\n            Box(\n                modifier = Modifier\n                    .widthIn(max = 900.dp)\n                    .fillMaxSize()\n            ) {\n            when (currentScreen) {'''
          replace_once('wide screen content container', old_root, new_root)

          old_root_end = '''                AppScreen.TAX_CALCULATOR -> TaxCalculatorScreen(viewModel)\n            }\n        }\n    }\n}\n\n@Composable\nfun Icon'''
          new_root_end = '''                AppScreen.TAX_CALCULATOR -> TaxCalculatorScreen(viewModel)\n            }\n            }\n        }\n    }\n}\n\n@Composable\nfun Icon'''
          replace_once('wide screen content container close', old_root_end, new_root_end)

          # Shared quick-action card: compact cards use icon-above-text; larger cards keep horizontal layout.
          old_quick = '''@Composable\nfun QuickActionCard(\n    modifier: Modifier = Modifier,\n    title: String,\n    subtitle: String,\n    icon: androidx.compose.ui.graphics.vector.ImageVector,\n    containerColor: Color,\n    contentColor: Color,\n    onClick: () -> Unit\n) {\n    Card(\n        modifier = modifier.clickable { onClick() },\n        colors = CardDefaults.cardColors(containerColor = containerColor),\n        shape = RoundedCornerShape(14.dp),\n        border = BorderStroke(1.dp, contentColor.copy(alpha = 0.2f))\n    ) {\n        Row(\n            modifier = Modifier.padding(12.dp),\n            verticalAlignment = Alignment.CenterVertically,\n            horizontalArrangement = Arrangement.spacedBy(10.dp)\n        ) {\n            Box(\n                modifier = Modifier\n                    .size(36.dp)\n                    .clip(CircleShape)\n                    .background(contentColor.copy(alpha = 0.15f)),\n                contentAlignment = Alignment.Center\n            ) {\n                Icon(\n                    imageVector = icon,\n                    contentDescription = title,\n                    tint = contentColor,\n                    modifier = Modifier.size(20.dp)\n                )\n            }\n            Column {\n                Text(\n                    text = title,\n                    fontWeight = FontWeight.Bold,\n                    fontSize = 13.sp,\n                    color = DarkNavy\n                )\n                Text(\n                    text = subtitle,\n                    fontSize = 10.sp,\n                    color = Color.Gray\n                )\n            }\n        }\n    }\n}\n'''
          new_quick = '''@Composable\nfun QuickActionCard(\n    modifier: Modifier = Modifier,\n    title: String,\n    subtitle: String,\n    icon: androidx.compose.ui.graphics.vector.ImageVector,\n    containerColor: Color,\n    contentColor: Color,\n    onClick: () -> Unit\n) {\n    Card(\n        modifier = modifier\n            .heightIn(min = 104.dp)\n            .clickable { onClick() },\n        colors = CardDefaults.cardColors(containerColor = containerColor),\n        shape = RoundedCornerShape(14.dp),\n        border = BorderStroke(1.dp, contentColor.copy(alpha = 0.2f))\n    ) {\n        BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {\n            val compactCard = maxWidth < 175.dp\n            if (compactCard) {\n                Column(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .padding(12.dp),\n                    verticalArrangement = Arrangement.spacedBy(8.dp)\n                ) {\n                    Box(\n                        modifier = Modifier\n                            .size(36.dp)\n                            .clip(CircleShape)\n                            .background(contentColor.copy(alpha = 0.15f)),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Icon(\n                            imageVector = icon,\n                            contentDescription = title,\n                            tint = contentColor,\n                            modifier = Modifier.size(20.dp)\n                        )\n                    }\n                    Text(\n                        text = title,\n                        fontWeight = FontWeight.Bold,\n                        fontSize = 13.sp,\n                        lineHeight = 16.sp,\n                        color = DarkNavy,\n                        maxLines = 2,\n                        overflow = TextOverflow.Ellipsis\n                    )\n                    Text(\n                        text = subtitle,\n                        fontSize = 10.sp,\n                        lineHeight = 13.sp,\n                        color = Color.Gray,\n                        maxLines = 2,\n                        overflow = TextOverflow.Ellipsis\n                    )\n                }\n            } else {\n                Row(\n                    modifier = Modifier\n                        .fillMaxWidth()\n                        .padding(12.dp),\n                    verticalAlignment = Alignment.CenterVertically,\n                    horizontalArrangement = Arrangement.spacedBy(10.dp)\n                ) {\n                    Box(\n                        modifier = Modifier\n                            .size(36.dp)\n                            .clip(CircleShape)\n                            .background(contentColor.copy(alpha = 0.15f)),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Icon(\n                            imageVector = icon,\n                            contentDescription = title,\n                            tint = contentColor,\n                            modifier = Modifier.size(20.dp)\n                        )\n                    }\n                    Column(modifier = Modifier.weight(1f)) {\n                        Text(\n                            text = title,\n                            fontWeight = FontWeight.Bold,\n                            fontSize = 13.sp,\n                            lineHeight = 16.sp,\n                            color = DarkNavy,\n                            maxLines = 2,\n                            overflow = TextOverflow.Ellipsis\n                        )\n                        Text(\n                            text = subtitle,\n                            fontSize = 10.sp,\n                            lineHeight = 13.sp,\n                            color = Color.Gray,\n                            maxLines = 2,\n                            overflow = TextOverflow.Ellipsis\n                        )\n                    }\n                }\n            }\n        }\n    }\n}\n'''
          replace_once('adaptive QuickActionCard', old_quick, new_quick)

          # Form pair in the unit editor: stack vertically on narrow dialogs.
          old_fields = '''                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        OutlinedTextField(\n                            value = editRentStr,\n                            onValueChange = { editRentStr = it },\n                            label = { Text("Kaltmiete (€)") },\n                            modifier = Modifier.weight(1f).testTag("edit_unit_rent")\n                        )\n                        OutlinedTextField(\n                            value = editAreaStr,\n                            onValueChange = { editAreaStr = it },\n                            label = { Text("Fläche (m²)") },\n                            modifier = Modifier.weight(1f).testTag("edit_unit_area")\n                        )\n                    }'''
          new_fields = '''                    BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {\n                        if (maxWidth < 360.dp) {\n                            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                                OutlinedTextField(\n                                    value = editRentStr,\n                                    onValueChange = { editRentStr = it },\n                                    label = { Text("Kaltmiete (€)") },\n                                    modifier = Modifier.fillMaxWidth().testTag("edit_unit_rent")\n                                )\n                                OutlinedTextField(\n                                    value = editAreaStr,\n                                    onValueChange = { editAreaStr = it },\n                                    label = { Text("Fläche (m²)") },\n                                    modifier = Modifier.fillMaxWidth().testTag("edit_unit_area")\n                                )\n                            }\n                        } else {\n                            Row(\n                                modifier = Modifier.fillMaxWidth(),\n                                horizontalArrangement = Arrangement.spacedBy(8.dp)\n                            ) {\n                                OutlinedTextField(\n                                    value = editRentStr,\n                                    onValueChange = { editRentStr = it },\n                                    label = { Text("Kaltmiete (€)") },\n                                    modifier = Modifier.weight(1f).testTag("edit_unit_rent")\n                                )\n                                OutlinedTextField(\n                                    value = editAreaStr,\n                                    onValueChange = { editAreaStr = it },\n                                    label = { Text("Fläche (m²)") },\n                                    modifier = Modifier.weight(1f).testTag("edit_unit_area")\n                                )\n                            }\n                        }\n                    }'''
          replace_once('adaptive unit editor field pair', old_fields, new_fields)

          # Receipt grid cards: let the category take remaining width instead of squeezing the date.
          old_category = '''                    Surface(\n                        shape = RoundedCornerShape(4.dp),\n                        color = categoryColor.copy(alpha = 0.12f)\n                    ) {'''
          new_category = '''                    Surface(\n                        modifier = Modifier.weight(1f, fill = false),\n                        shape = RoundedCornerShape(4.dp),\n                        color = categoryColor.copy(alpha = 0.12f)\n                    ) {'''
          replace_once('receipt grid category width', old_category, new_category)

          # Add breathing room between category and date on receipt grid cards.
          old_date = '''                    Text(\n                        text = receipt.datum,\n                        fontSize = 9.5.sp,'''
          new_date = '''                    Spacer(modifier = Modifier.width(6.dp))\n                    Text(\n                        text = receipt.datum,\n                        fontSize = 9.5.sp,'''
          replace_once('receipt grid date spacing', old_date, new_date)

          p.write_text(s, encoding='utf-8')
          if s == original:
              raise SystemExit('No responsive changes applied')
          PY

          git diff --check
          git diff -- app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified responsive UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "UI: responsive Darstellung für kleine und große Displays"
          git push origin HEAD:main

      - name: Prepare direct release files
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-responsive-${SHORT_SHA}.apk"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scope=UI-only responsive pass"
          } > build-info.txt

      - name: Publish responsive test APK directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: responsive-${{ github.run_id }}
          name: Steuer-Assistent Responsive Testversion
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-responsive-*.apk
            build-info.txt
          fail_on_unmatched_files: true
