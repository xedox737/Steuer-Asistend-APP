name: AfA Karten aktives Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-tax-cards-compact-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply compact dashboard tax cards
        run: python3 .github/scripts/fix_tax_cards_compact_dashboard.py

      - name: Verify cards are before active dashboard return
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt').read_text()
          active = s.split('fun DashboardScreen',1)[1].split('\n    return\n',1)[0]
          assert 'Text("AfA Gebäude", fontSize = 15.sp' in active
          assert 'Text("15%-Sanierungsmonitor"' in active
          print('Active compact dashboard contains AfA and 15% monitor')
          PY

      - name: Compile Kotlin
        timeout-minutes: 10
        run: gradle compileDebugKotlin --stacktrace --no-daemon

      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified source and clean temporary files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git rm .github/scripts/fix_tax_cards_compact_dashboard.py .github/workflows/fix-tax-cards-compact-dashboard.yml
          git commit -m "Fix: AfA und 15-Prozent-Monitor im aktiven Dashboard anzeigen [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-AfA-Dashboard-${{ steps.commit.outputs.short }}.apk"

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: afa-dashboard-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent AfA Dashboard Fix
          body: |
            AfA-Karte und 15%-Sanierungsmonitor werden jetzt im tatsächlich aktiven kompakten Dashboard angezeigt.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-AfA-Dashboard-*.apk
