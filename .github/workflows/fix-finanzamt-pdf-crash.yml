name: Fix Finanzamt PDF crash

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-finanzamt-pdf-crash.yml"

permissions:
  contents: write

jobs:
  fix-finanzamt-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply robust PDF crash fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # PdfExporter: replace the stale first-page canvas with a helper that always
          # returns the canvas of the currently open PDF page.
          p = Path('app/src/main/java/com/example/util/PdfExporter.kt')
          s = p.read_text(encoding='utf-8')
          method_start = s.find('    fun exportReceiptsToPdf(')
          share_start = s.find('    fun sharePdf(', method_start)
          if method_start < 0 or share_start < 0:
              raise SystemExit('PdfExporter methods not found')
          section = s[method_start:share_start]

          if 'fun activeCanvas(): Canvas' not in section:
              section, count = re.subn(
                  r'(\n\s*startNewPage\(\)\s*\n)\s*val cv = canvas!!',
                  r'\1        fun activeCanvas(): Canvas = requireNotNull(canvas) { "PDF canvas is not available" }',
                  section,
                  count=1
              )
              if count != 1:
                  raise SystemExit('Could not replace stale PDF canvas declaration')

          report_start = section.find('// Report Primary Header')
          close_start = section.find('// Close Document', report_start)
          if report_start < 0 or close_start < 0:
              raise SystemExit('PDF drawing range not found')
          drawing = section[report_start:close_start]
          drawing = drawing.replace('cv.', 'activeCanvas().')
          section = section[:report_start] + drawing + section[close_start:]
          s = s[:method_start] + section + s[share_start:]
          p.write_text(s, encoding='utf-8')

          # ViewModel: runtime errors must return null instead of killing the app.
          p = Path('app/src/main/java/com/example/ui/ReceiptViewModel.kt')
          s = p.read_text(encoding='utf-8')
          if 'Finanzamt PDF export failed' not in s:
              pattern = re.compile(
                  r'(    fun exportToPdf\(context: Context, taxYear: Int, includeTaxAdvisorSummary: Boolean = false\): File\? \{\n'
                  r'        val currentReceipts = receipts\.value\n'
                  r'        val currentMeta = propertyMetadata\.value\n)'
                  r'        return PdfExporter\.exportReceiptsToPdf\(context, taxYear, currentReceipts, currentMeta, includeTaxAdvisorSummary\)\n'
                  r'    \}'
              )
              replacement = (
                  r'\1'
                  '        return try {\n'
                  '            PdfExporter.exportReceiptsToPdf(context, taxYear, currentReceipts, currentMeta, includeTaxAdvisorSummary)\n'
                  '        } catch (e: Exception) {\n'
                  '            Log.e("ReceiptViewModel", "Finanzamt PDF export failed", e)\n'
                  '            null\n'
                  '        }\n'
                  '    }'
              )
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Could not protect exportToPdf')
              p.write_text(s, encoding='utf-8')

          # UI: keep dialog open and show a visible error if generation fails.
          p = Path('app/src/main/java/com/example/ui/ReceiptAppUi.kt')
          s = p.read_text(encoding='utf-8')
          if 'PDF konnte nicht erstellt werden. Bitte erneut versuchen.' not in s:
              old = '''                        if (pdfFile != null) {
                            com.example.util.PdfExporter.sharePdf(context, pdfFile)
                        }
                        showTaxYearDialog = false'''
              new = '''                        if (pdfFile != null) {
                            com.example.util.PdfExporter.sharePdf(context, pdfFile)
                            showTaxYearDialog = false
                        } else {
                            android.widget.Toast.makeText(
                                context,
                                "PDF konnte nicht erstellt werden. Bitte erneut versuchen.",
                                android.widget.Toast.LENGTH_LONG
                            ).show()
                        }'''
              if old not in s:
                  raise SystemExit('Could not find Finanzamt export button body')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

          git diff --check

      - name: Verify source fix
        run: |
          grep -q 'fun activeCanvas(): Canvas' app/src/main/java/com/example/util/PdfExporter.kt
          grep -q 'Finanzamt PDF export failed' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'PDF konnte nicht erstellt werden. Bitte erneut versuchen.' app/src/main/java/com/example/ui/ReceiptAppUi.kt

      - name: Verify lint
        timeout-minutes: 10
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Commit verified crash fix
        id: commit_fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/util/PdfExporter.kt app/src/main/java/com/example/ui/ReceiptViewModel.kt app/src/main/java/com/example/ui/ReceiptAppUi.kt
          git commit -m "Fix: Finanzamt PDF-Export darf App nicht mehr abstürzen"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare single test release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-debug-${{ steps.commit_fix.outputs.short_sha }}.apk"
          {
            echo "commit=${{ steps.commit_fix.outputs.sha }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt

      - name: Publish fixed APK once
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-crash-fix-${{ steps.commit_fix.outputs.sha }}
          target_commitish: ${{ steps.commit_fix.outputs.sha }}
          name: Steuer-Assistent PDF-Crashfix
          body: |
            Testversion mit repariertem Finanzamt-PDF-Export.
            Verhindert Absturz bei Seitenumbrüchen und fängt PDF-Laufzeitfehler ab.
          prerelease: true
          make_latest: false
          files: |
            Steuer-Assistent-debug-*.apk
            build-info.txt
          fail_on_unmatched_files: true
