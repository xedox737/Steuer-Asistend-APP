name: Altbeleg Beschreibung Runtime Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/fix_legacy_description_runtime.py"
      - ".github/workflows/fix-legacy-description-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Apply runtime fix
        run: python3 .github/scripts/fix_legacy_description_runtime.py
      - name: Verify markers
        shell: bash
        run: |
          git diff --check
          grep -q 'Keine KI-API konfiguriert' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'descriptionBackfillMissingOriginals' app/src/main/java/com/example/ui/ReceiptViewModel.kt
          grep -q 'if (!email.isNullOrBlank())' app/src/main/java/com/example/ui/ReceiptViewModel.kt
      - name: Compile Kotlin
        timeout-minutes: 10
        run: gradle compileDebugKotlin --stacktrace --no-daemon
      - name: Run unit tests
        timeout-minutes: 10
        run: gradle testDebugUnitTest --stacktrace --no-daemon
      - name: Build debug APK
        timeout-minutes: 10
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Commit verified source and clean temporary CI files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/ReceiptViewModel.kt
          git rm .github/scripts/fix_legacy_description_runtime.py .github/workflows/fix-legacy-description-runtime.yml
          git commit -m "Fix: Altbeleg-Nacherkennung lädt Drive-Originale zuverlässig"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Steuer-Assistent-Altbeleg-Runtime-Fix-${{ steps.commit.outputs.short }}.apk"
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: legacy-description-runtime-${{ steps.commit.outputs.sha }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Steuer-Assistent Altbeleg Runtime Fix
          body: |
            Korrigiert das Drive-Nachladen restaurierter Altbelege und zeigt klare Ursachen bei 0 Vorschlägen.
          prerelease: true
          make_latest: false
          files: Steuer-Assistent-Altbeleg-Runtime-Fix-*.apk
